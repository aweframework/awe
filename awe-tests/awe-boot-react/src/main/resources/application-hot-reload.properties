# Hot-reload profile: relax static resource handling so a rebuilt webpack bundle
# is served immediately, without a server restart. Production caching stays in
# application.properties; these overrides only apply under the "hot-reload"
# Spring profile (activated by `npm run start:hot-reload`).
#
# The content strategy stays ON so the URL of a bundle carries its hash: a browser that cached bundle.js or
# bundle.css from an earlier run (application.properties asks for a one-year max-age) keeps serving that copy for
# the stable URL, whatever the response headers say now. With the hash, every rebuild is a new URL.
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/js/**,/css/**,/images/**

# AWE XML definition hot reload (awe-starter-parent 4.12+, development only).
# Edit any XML descriptor under the watched sources (screens, queries, maintain,
# services, enumerated, queues, emails, actions, profiles, locales, menus) and the
# framework copies it to the matching exploded-classpath location and reloads it in
# place: no JVM restart, just refresh the browser.
awe.application.xml-hot-reload=true
awe.application.xml-hot-reload-sources=src/main/resources,../../awe-framework/awe-modules/awe-scheduler/src/main/resources

# spring-boot-devtools: don't restart the JVM when application XML descriptors
# change (they are reloaded by the framework, not the classloader).
spring.devtools.restart.additional-exclude=application/**

# Demo data of the scheduler Activity screen (SchedulerActivityDemoData): on every start it replaces the demo tasks
# 9012-9020 and their executions of the last 7 days (dates relative to now). Set to false to stop loading it; remove it
# from the database with db/demo/hsqldb/scheduler-activity-demo-clean.sql.
awe-react.demo.scheduler-activity=true
# The demo execution logs live in the database store, so the side panel log shows them.
awe.scheduler.execution-log-store=database
