<h2>Customers</h2>
<p>The <strong>Customers</strong> screen lists every customer and lets you edit one.</p>
<h3>Search</h3>
<ul>
  <li>Type a name or an email in <em>Search</em> and press Enter.</li>
  <li>Use the filters to narrow the list by plan or status.</li>
</ul>
<h3>Edit a customer</h3>
<p>Select a row and choose <em>Edit</em>. Changes are saved when you press <em>Save</em>.</p>
