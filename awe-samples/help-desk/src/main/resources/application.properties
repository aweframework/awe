##############################################################
# Beacon Desk: AWE sample application (React engine), help desk
##############################################################

# Application
spring.application.name=help-desk
# Modules: the application first, then the React engine and the AWE core (the first module that declares something wins)
awe.application.module-list=helpdesk,awe-react,awe
awe.application.name=Beacon Desk
awe.application.acronym=helpdesk
awe.application.paths.base=${user.home}/awe-samples/help-desk
awe.application.filemanager.base-path=/
awe.application.language-default=en-GB
awe.application.component.size=md

# Look: AWE 5 theme. Primary colour and mode come from the properties (the user can still choose light or dark)
awe.application.theme=default
awe.application.theme-primary=violet
awe.application.theme-mode=system

# Sign-in page: own logo, background and texts (locale keys), with the demo credentials in the caption of the image panel
awe.application.login.logo=images/logo/help-desk.svg
# Icon of the browser tab: the mark of the application in its primary colour
awe.application.paths.icon-favicon=images/logo/help-desk-icon.svg
awe.application.paths.icon-phone=images/logo/help-desk-icon.png
awe.application.paths.icon-tablet=images/logo/help-desk-icon.png
awe.application.login.logo-dark=images/logo/help-desk-dark.svg
awe.application.login.layout=form-only
awe.application.login.background=images/backgrounds/help-desk.svg
awe.application.login.title=HD_LOGIN_TITLE
awe.application.login.subtitle=HD_LOGIN_SUBTITLE
awe.application.login.panel-title=HD_LOGIN_PANEL_TITLE
awe.application.login.panel-subtitle=HD_LOGIN_DEMO

# Screen after the sign-in of a user whose profile has no initial screen (the agents, the supervisor and the requesters have theirs in AwePro.ScrIni)
awe.application.screen.initial=hd-queue

# Server. This sample uses its own port, so it can run next to the other AWE applications
server.port=18103
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=256
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# Static resources
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=31557600
spring.web.resources.chain.cache=true
spring.web.resources.chain.compressed=true
spring.web.resources.chain.strategy.content.enabled=true

# Cache: in memory, enough for a single node
spring.cache.type=simple

# Database: HSQLDB file database in target/db. Flyway runs the migrations of AWE and this
# application (HELPDESK): src/main/resources/db/migration/hsqldb/HELPDESK_V1.0.0__Init_help_desk.sql
spring.datasource.url=jdbc:hsqldb:file:target/db/help-desk
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
awe.database.migration-modules=AWE,HELPDESK

# Security
# SAMPLE VALUE: the master key encrypts the stored data. Set the environment variable AWE_MASTER_KEY in any real deployment
awe.security.master-key=${AWE_MASTER_KEY:help-desk-sample-master-key-change-it}
awe.rest.api.jwt.secret=${AWE_JWT_SECRET:help-desk-sample-jwt-secret-change-it-too-0123456789abcdef}
awe.security.totp.enabled=disabled
awe.security.authorization.mode=enforce
# NOTE: awe.security.permissions.require-undeclared=true would also protect the AWE targets that declare no permission when the
# REST API is exposed, but it removes the Login button of the sign-in page (the login service declares none), so it stays off here.
# Every query and maintain target of this application declares its permission.
# REST API: authenticate on /api/authenticate (local JWT, signed with awe.rest.api.jwt.secret), then call /api/data/<query> and
# /api/maintain/<target> with the same permissions of the profile of the user
awe.rest.api.auth.mode=local-jwt
awe.rest.api.jwt.expiration-time=60m

# Logs
logging.level.org.springframework.web=info
