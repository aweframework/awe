##############################################################
# Meridian Freight: AWE sample application (React engine), fleet and logistics
##############################################################

# Application
spring.application.name=fleet-logistics
# Modules: the application first, then the React engine, the scheduler and notifier modules and the AWE core (the first module that declares something wins)
awe.application.module-list=fleet,awe-react,awe-scheduler,awe-notifier,awe
awe.application.name=Meridian Freight
awe.application.acronym=fleet
awe.application.paths.base=${user.home}/awe-samples/fleet-logistics
awe.application.filemanager.base-path=/
awe.application.language-default=en-GB
awe.application.component.size=md

# Look: AWE 5 theme. Primary colour and mode come from the properties (the user can still choose light or dark)
awe.application.theme=default
awe.application.theme-primary=blue
awe.application.theme-mode=system

# Sign-in page: own logo, background and texts (locale keys), with the demo credentials in the caption of the image panel
awe.application.login.logo=images/logo/fleet-logistics.svg
# Icon of the browser tab: the mark of the application in its primary colour
awe.application.paths.icon-favicon=images/logo/fleet-logistics-icon.svg
awe.application.paths.icon-phone=images/logo/fleet-logistics-icon.png
awe.application.paths.icon-tablet=images/logo/fleet-logistics-icon.png
awe.application.login.logo-dark=images/logo/fleet-logistics-dark.svg
awe.application.login.layout=split
awe.application.login.background=images/backgrounds/fleet-logistics.svg
awe.application.login.background-effect=route-grid
awe.application.login.title=FLT_LOGIN_TITLE
awe.application.login.subtitle=FLT_LOGIN_SUBTITLE
awe.application.login.panel-title=FLT_LOGIN_PANEL_TITLE
awe.application.login.panel-subtitle=FLT_LOGIN_DEMO

# Screen after the sign-in of a user whose profile has no initial screen (the dispatchers and the customers have theirs in AwePro.ScrIni)
awe.application.screen.initial=fleet-dashboard

# Server. This sample uses its own port, so it can run next to the other AWE applications
server.port=18102
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=256
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# Static resources
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=31557600
spring.web.resources.chain.cache=true
spring.web.resources.chain.compressed=true
spring.web.resources.chain.strategy.content.enabled=true

# Cache: in memory, enough for a single node
spring.cache.type=simple

# Database: HSQLDB file database in target/db. Flyway runs the migrations of AWE, the scheduler, the notifier and this
# application (FLEET): src/main/resources/db/migration/hsqldb/FLEET_V1.0.0__Init_fleet.sql
spring.datasource.url=jdbc:hsqldb:file:target/db/fleet-logistics
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
awe.database.migration-modules=AWE,SCHEDULER,NOTIFIER,FLEET

# Scheduler: the tasks stored in the database (AweSchTsk) are loaded when the application starts
awe.scheduler.tasks-load-on-start=true

# Security
# SAMPLE VALUE: the master key encrypts the stored data. Set the environment variable AWE_MASTER_KEY in any real deployment
awe.security.master-key=${AWE_MASTER_KEY:fleet-logistics-sample-master-key-change-it}
awe.security.totp.enabled=disabled
awe.security.authorization.mode=enforce

# Logs
logging.level.org.springframework.web=info
