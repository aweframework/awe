##############################################################
# Veterinary clinic: AWE sample application (React engine)
##############################################################

# Application
spring.application.name=vet-clinic
# Modules: the application first, then the React engine and the AWE core (the first module that declares something wins)
awe.application.module-list=vetclinic,awe-react,awe
awe.application.name=Happy Paws Veterinary Clinic
awe.application.acronym=vetclinic
awe.application.paths.base=${user.home}/awe-samples/vet-clinic
# Folder of the files that the uploader criterion stores (documents and x-rays of the pets)
awe.application.filemanager.base-path=/
awe.application.language-default=en-GB
awe.application.component.size=md

# Look: AWE 5 theme. Primary colour and mode come from the properties (the user can still choose light or dark)
awe.application.theme=default
awe.application.theme-primary=orange
awe.application.theme-mode=system

# Sign-in page: the generic one, with the demo credentials in the caption of the image panel (locale key VET_LOGIN_DEMO)
awe.application.login.logo=images/logo/vet-clinic.svg
# Icon of the browser tab: the mark of the application in its primary colour
awe.application.paths.icon-favicon=images/logo/vet-clinic-icon.svg
awe.application.paths.icon-phone=images/logo/vet-clinic-icon.png
awe.application.paths.icon-tablet=images/logo/vet-clinic-icon.png
awe.application.login.logo-dark=images/logo/vet-clinic-dark.svg
awe.application.login.layout=card
awe.application.login.background=images/photos/cat-puppy-2000.webp
awe.application.login.title=VET_LOGIN_TITLE
awe.application.login.subtitle=VET_LOGIN_SUBTITLE
awe.application.login.panel-title=VET_LOGIN_PANEL_TITLE
awe.application.login.panel-subtitle=VET_LOGIN_DEMO

# Screen after the sign-in of a user whose profile has no initial screen (the staff and the owners have theirs in AwePro.ScrIni)
awe.application.screen.initial=vet-dashboard

# Server. This sample uses its own port, so it can run next to the other AWE applications
server.port=18101
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=256
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# Static resources
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=31557600
spring.web.resources.chain.cache=true
spring.web.resources.chain.compressed=true
spring.web.resources.chain.strategy.content.enabled=true

# Cache: in memory, enough for a single node
spring.cache.type=simple

# Database: HSQLDB file database in target/db. Flyway runs the AWE migrations (AWE) and the ones of this
# application (VETCLINIC): src/main/resources/db/migration/hsqldb/VETCLINIC_V1.0.0__Init_vet_clinic.sql
spring.datasource.url=jdbc:hsqldb:file:target/db/vet-clinic
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
awe.database.migration-modules=AWE,VETCLINIC

# Security
# SAMPLE VALUE: the master key encrypts the stored data. Set the environment variable AWE_MASTER_KEY in any real deployment
awe.security.master-key=${AWE_MASTER_KEY:vet-clinic-sample-master-key-change-it}
awe.security.totp.enabled=disabled
# Every query and maintain target of the clinic declares a permission and the screen access is checked (enforce is the default)
awe.security.authorization.mode=enforce

# Logs
logging.level.org.springframework.web=info
