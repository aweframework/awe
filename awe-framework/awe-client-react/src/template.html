<!doctype html>
<!--[if IE 9 ]><html xmlns:th="http://www.thymeleaf.org" th:with="splashLogoPath=${splashLogo == null or #strings.contains(splashLogo, '://') or #strings.startsWith(splashLogo, '/') ? splashLogo : '/' + splashLogo}, splashLogoUrl=${splashLogoPath} ? @{${splashLogoPath}}" th:style="${splashLogoUrl} ? |--awe-splash-logo: url('${splashLogoUrl}'); --awe-splash-liquid: url('${splashLogoUrl}') center / contain no-repeat|" th:classappend="${themeMode}" class="ie gt-ie8 gt-ie9 pxajs" lang="EN"><![endif]-->
<!--[if !IE]><!--><html xmlns:th="http://www.thymeleaf.org" th:with="splashLogoPath=${splashLogo == null or #strings.contains(splashLogo, '://') or #strings.startsWith(splashLogo, '/') ? splashLogo : '/' + splashLogo}, splashLogoUrl=${splashLogoPath} ? @{${splashLogoPath}}" th:style="${splashLogoUrl} ? |--awe-splash-logo: url('${splashLogoUrl}'); --awe-splash-liquid: url('${splashLogoUrl}') center / contain no-repeat|" th:classappend="${themeMode}" class="gt-ie8 gt-ie9 pxajs" lang="EN"><!--<![endif]-->
  <head>
    <base th:href="@{/}"/>
    <!-- The last mode applied on this browser wins over the mode of the application before the splash paints -->
    <script>try{var m=localStorage.getItem("awe-theme-mode"),c=document.documentElement.classList;"light"!==m&&"dark"!==m&&"system"!==m||(c.remove("light","dark"),"system"!==m&&c.add(m))}catch(e){}</script>
    <link rel="stylesheet" th:href="@{/css/splash.css}"/>
    <title>Loading...</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta http-equiv="X-UA-Compatible" content="chrome=1"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <meta name="HandheldFriendly" content="true"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <link rel="shortcut icon" th:href="${faviconIcon}"/>
    <link rel="apple-touch-icon" th:href="${tabletIcon}"/>
  </head>
  <body th:with="navbarLogoUrl=${navbarLogo == null or #strings.contains(navbarLogo, '://') or #strings.startsWith(navbarLogo, '/') ? navbarLogo : '/' + navbarLogo}, navbarRailLogoUrl=${navbarRailLogo == null or #strings.contains(navbarRailLogo, '://') or #strings.startsWith(navbarRailLogo, '/') ? navbarRailLogo : '/' + navbarRailLogo}, navbarBrandStyle=${navbarLogoUrl} ? |--awe-navbar-logo: url('${navbarLogoUrl}'); --awe-navbar-wordmark: none; --awe-navbar-logo-size: contain;| : '', navbarRailStyle=${navbarRailLogoUrl} ? |--awe-navbar-logo-rail: url('${navbarRailLogoUrl}'); --awe-navbar-logo-size: contain;| : ''" th:style="${navbarBrandStyle + navbarRailStyle}">
    <div id="root" class="expand expandible-vertical">
      <div id="splash" role="status" aria-busy="true">
        <div id="splashBackground"></div>
        <div class="splash-logo" aria-hidden="true"><div class="splash-fill"><div class="splash-level"><div class="splash-cover"></div></div></div></div>
        <span class="splash-label">Loading</span>
      </div>
    </div>
  </body>
</html>
