<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:utext="${title} ?: 'Oops! Something went wrong'">Oops! Something went wrong</title>
    <!-- The AWE 5 tokens (#885) the generic screens publish: the page follows the colour mode of the system. A plain
         href: ErrorPageService renders without a request, so a context-relative th:href would fail -->
    <link rel="stylesheet" href="/css/awe-design-tokens/tokens.css">
    <style>
        :root {
            color-scheme: light dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--awe-font-family-base);
            font-size: var(--awe-font-size-base);
            line-height: var(--awe-line-height-base);
            color: var(--awe-color-text);
            background: var(--awe-color-background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--awe-space-5);
        }

        .error-container {
            background: var(--awe-color-surface);
            border: 1px solid var(--awe-color-border);
            border-radius: var(--awe-radius-card);
            box-shadow: var(--awe-shadow-lg);
            padding: var(--awe-space-10);
            max-width: calc(var(--awe-space-16) * 8);
            width: 100%;
            text-align: center;
            animation: slideUp var(--awe-motion-duration-slow) var(--awe-motion-easing-enter);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(var(--awe-space-6));
            }
        }

        .error-icon {
            width: calc(var(--awe-space-16) + var(--awe-space-4));
            height: calc(var(--awe-space-16) + var(--awe-space-4));
            margin: 0 auto var(--awe-space-6);
            background: var(--awe-color-danger-subtle);
            border-radius: var(--awe-radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--awe-font-size-3xl);
            color: var(--awe-color-danger-text);
        }

        .error-title {
            font-size: var(--awe-font-size-2xl);
            font-weight: var(--awe-font-weight-bold);
            line-height: var(--awe-line-height-tight);
            letter-spacing: var(--awe-letter-spacing-display);
            color: var(--awe-color-text-emphasis);
            margin-bottom: var(--awe-space-4);
        }

        .error-message {
            font-size: var(--awe-font-size-base);
            color: var(--awe-color-text);
            line-height: var(--awe-line-height-base);
            margin-bottom: var(--awe-space-8);
            padding: var(--awe-space-4) var(--awe-space-5);
            background: color-mix(in srgb, var(--awe-color-danger-subtle), var(--awe-color-surface) 45%);
            border: 1px solid var(--awe-color-danger-border);
            border-radius: var(--awe-radius-content);
            text-align: left;
        }

        .error-message strong {
            font-weight: var(--awe-font-weight-semibold);
            color: var(--awe-color-danger-text);
        }

        .error-actions {
            display: flex;
            gap: var(--awe-space-3);
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            min-height: var(--awe-size-control);
            padding: var(--awe-field-padding-y) var(--awe-button-padding-x);
            border-radius: var(--awe-radius-field);
            font-family: inherit;
            font-weight: var(--awe-font-weight-medium);
            font-size: var(--awe-font-size-base);
            line-height: var(--awe-line-height-base);
            transition: background-color var(--awe-motion-duration-fast) var(--awe-motion-easing-standard);
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn:focus-visible {
            outline: var(--awe-focus-ring);
            outline-offset: var(--awe-focus-ring-offset);
        }

        .btn-primary {
            background: var(--awe-color-primary);
            color: var(--awe-color-on-primary);
        }

        .btn-primary:hover {
            background: var(--awe-color-primary-hover);
        }

        .btn-secondary {
            background: var(--awe-color-secondary);
            color: var(--awe-color-on-secondary);
        }

        .btn-secondary:hover {
            background: var(--awe-color-secondary-hover);
        }

        @media (max-width: 480px) {
            .error-container {
                padding: var(--awe-space-6);
            }

            .error-title {
                font-size: var(--awe-font-size-xl);
            }

            .error-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon" th:utext="${icon} ?: '⚠'">⚠</div>
        <h1 class="error-title" th:utext="${title} ?: 'Oops! Something went wrong'">Oops! Something went wrong</h1>
        <div class="error-message">
            <strong th:utext="${messagePrefix} ?: 'Unable to complete the process:'">Unable to complete the process:</strong><br>
            <span th:utext="${message} ?: 'An unexpected error occurred. Please try again later.'">An unexpected error occurred. Please try again later.</span>
        </div>
        <div class="error-actions">
            <button class="btn btn-primary" onclick="window.history.back()" th:utext="${backButtonText} ?: 'Go Back'">Go Back</button>
            <button class="btn btn-secondary" th:data-home-url="${homeUrl} ?: '/'" onclick="window.location.href=this.getAttribute('data-home-url')" th:utext="${homeButtonText} ?: 'Home'">Home</button>
        </div>
    </div>
</body>
</html>
