<div ng-show="controller.visible" data-testid="grid" class="grid expandible-vertical table-light {{::component.gridStyle}}" ng-attr-aria-busy="{{controller.loading || undefined}}" ui-dependency="dependencies" ng-cloak>
  <awe-context-menu ng-cloak></awe-context-menu>
  <awe-grid-toolbar ng-if="controller.showToolbar !== false || controller.quickFilter || controller.search"></awe-grid-toolbar>
  <awe-grid-selection-bar ng-if="::component.selectionButtons.length"></awe-grid-selection-bar>
  <div ng-if="component.fixedHeaders" ng-attr-id="grid-header-{{::gridId}}" awe-grid-header="gridOptions" ng-cloak></div>
  <div ng-attr-id="scope-{{::gridId}}" class="expand expandible-vertical grid-container" ng-cloak>
    <div ng-if="::component.editable" class="save-button" ng-cloak>
      <button id="{{::gridId}}-grid-row-cancel" type="button" ng-class="::component.gridButtonClass" class="btn-awe btn-danger grid-row-cancel" data-testid="grid-row-cancel" title="{{'BUTTON_CANCEL'| translateMultiple}}" ng-click="onCancelRow()" ng-attr-tabindex="{{component.isEditing ? 0 : -1}}" ng-disabled="component.savingRow" ng-cloak>
        <i><svg class="awe-icon awe-icon-spin" aria-hidden="true" focusable="false" ng-if="component.rowAction === 'cancel' && component.savingRow"><use ng-attr-href="{{::('refresh' | aweIcon).href}}"></use></svg><svg class="awe-icon" aria-hidden="true" focusable="false" ng-if="component.rowAction !== 'cancel'"><use ng-attr-href="{{::('close' | aweIcon).href}}"></use></svg></i>
        <span class="button-text" translate-multiple="BUTTON_CANCEL"></span>
      </button>
      <button id="{{::gridId}}-grid-row-save" type="button" ng-class="::component.gridButtonClass" class="btn-awe btn-primary grid-row-save" data-testid="grid-row-save" title="{{'BUTTON_SAVE_ROW'| translateMultiple}}" ng-click="onSaveRow()" ng-attr-tabindex="{{component.isEditing ? 0 : -1}}" ng-disabled="component.savingRow" ng-cloak>
        <i><svg class="awe-icon awe-icon-spin" aria-hidden="true" focusable="false" ng-if="component.rowAction === 'save' && component.savingRow"><use ng-attr-href="{{::('refresh' | aweIcon).href}}"></use></svg><svg class="awe-icon" aria-hidden="true" focusable="false" ng-if="component.rowAction !== 'save'"><use ng-attr-href="{{::('save' | aweIcon).href}}"></use></svg></i>
        <span class="button-text" translate-multiple="BUTTON_SAVE_ROW"></span>
      </button>
    </div>
    <div ng-attr-id="grid-{{::gridId}}" ui-grid="gridOptions" ui-grid-selection ui-grid-resize-columns ui-grid-move-columns ui-grid-pinning ui-grid-tree-view class="ag-awe grid-node no-border-hr" ng-cloak></div>
  </div>
  <div class="table-footer">
    <div class="pagination-content grid-buttons fixed-height {{component.footerButtonStyle}}">
      <div ng-transclude></div>
    </div>
  </div>
  <awe-loader class="loader grid-loader" data-testid="grid-loader" ng-if="controller.loading && !component.isLoadingBranch && !skeletonLoader" icon-loader="{{::iconLoader}}" ng-cloak></awe-loader>
  <awe-grid-skeleton class="grid-skeleton" data-testid="grid-loader" ng-if="controller.loading && !component.isLoadingBranch && skeletonLoader && !(dimReload && model.values.length)" ng-cloak></awe-grid-skeleton>
  <awe-loader class="loader grid-loader" skeleton="reload" data-testid="grid-loader" ng-if="controller.loading && !component.isLoadingBranch && dimReload && model.values.length" icon-loader="{{::iconLoader}}" ng-cloak></awe-loader>
</div>
