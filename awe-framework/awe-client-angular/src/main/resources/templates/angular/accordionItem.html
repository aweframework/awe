<div class="panel {{::controller.style}}" ng-class="{'panel-invalid': hasInvalid}" ng-attr-data-invalid="{{!!hasInvalid}}">
    <div class="panel-heading">
        <a class="accordion-toggle" href="#{{::itemId}}" aria-expanded="{{isSelected}}" ng-click="onClick(itemId, $event)" translate-multiple="{{controller.label}}"></a>
    </div>
    <div id="{{::itemId}}" class="panel-collapse collapse" aria-expanded="{{isSelected}}">
        <div ng-transclude class="panel panel-body"></div>
    </div>
</div>
