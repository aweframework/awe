<div class="chart expand {{::controller.style}}" ng-show="controller.visible" ui-dependency="dependencies" data-testid="chart" data-rendered="{{component.rendered === true}}" data-zoomed="{{component.isZoomed()}}" ng-cloak>
  <div class="chart-container" ui-chart="component.echartsModel"></div>
  <awe-context-menu ng-cloak></awe-context-menu>
  <awe-loader class="loader chart-loader" skeleton="chart" ng-if="controller.loading" icon-loader="{{::iconLoader}}" ng-cloak></awe-loader>
</div>
