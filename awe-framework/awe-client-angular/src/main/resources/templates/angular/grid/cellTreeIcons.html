<div class="ui-grid-tree-base-row-header-buttons" column-id="{{col.name}}" data-testid="grid-cell" ng-class="{'ui-grid-tree-base-header': row.treeLevel > -1 }" ng-style="::{'padding-left': grid.options.treeIndent * row.treeLevel + 'px'}">
  <i class="tree-icon fa {{row.entity.$$treeIcon}}" data-testid="tree-icon" ng-attr-data-expanded="{{!!row.entity.$$expanded}}" ng-attr-data-loading="{{!!row.entity.$$isLoading}}" ng-click="grid.appScope.component.treeButtonClick(row, $event)"></i> &nbsp;
</div>
