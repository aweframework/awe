<div class="ui-grid-tree-base-row-header-buttons" column-id="{{col.name}}" data-testid="grid-cell" ng-class="{'ui-grid-tree-base-header': row.treeLevel > -1 }" ng-style="::{'padding-left': grid.options.treeIndent * row.treeLevel + 'px'}">
  <i class="tree-icon {{(row.entity.$$treeIcon | aweIcon).family == 'lucide' ? '' : 'fa ' + row.entity.$$treeIcon}}" data-testid="tree-icon" ng-attr-data-expanded="{{!!row.entity.$$expanded}}" ng-attr-data-loading="{{!!row.entity.$$isLoading}}" ng-attr-tabindex="{{row.entity.$$isLeaf ? undefined : 0}}" ng-attr-role="{{row.entity.$$isLeaf ? undefined : 'button'}}" ng-attr-aria-expanded="{{row.entity.$$isLeaf ? undefined : !!row.entity.$$expanded}}" ng-click="grid.appScope.component.treeButtonClick(row, $event)" ng-keydown="($event.key === 'Enter' || $event.key === ' ') && ($event.preventDefault() || grid.appScope.component.treeButtonClick(row, $event))"><svg ng-if="(row.entity.$$treeIcon | aweIcon).family == 'lucide'" class="awe-icon" ng-class="(row.entity.$$treeIcon | aweIcon).classes" aria-hidden="true" focusable="false"><use ng-attr-href="{{(row.entity.$$treeIcon | aweIcon).href}}"></use></svg></i> &nbsp;
</div>
