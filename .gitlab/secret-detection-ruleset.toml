# Secret detection ruleset: default gitleaks rules plus checked false positives
   [secrets]
     [[secrets.passthrough]]
       type   = "raw"
       target = "gitleaks.toml"
       value  = """
   [extend]
   # Default packaged ruleset of the analyzer: do not change the path
   path = "/gitleaks.toml"

   [allowlist]
   description = "Checked false positives"
   # df85f3d29 (#993): fake OpenSSH key of a test, not a real key
   commits = ["df85f3d290f877cf66d2af1278e25418b6949369"]
   """
