##############################
# Pipeline definition
##############################

include:
  # Security Products features
  - template: DAST.gitlab-ci.yml
  - template: Dependency-Scanning.gitlab-ci.yml
  - template: Secret-Detection.gitlab-ci.yml
  - template: Container-Scanning.gitlab-ci.yml

# A new commit cancels the interruptible jobs (build, tests, analysis) of the older pipelines of the same ref: on merge
# request and feature branches, and on develop pushes, where merges often come in a row and only the newest commit matters.
# A job that publishes, deploys or must see every commit (secret detection) sets interruptible: false and always finishes;
# a job whose needs were cancelled does not start. Never cancelled: scheduled pipelines (the weekly develop pipeline runs
# the Selenium suites), develop pipelines started from Run pipeline, the API or a trigger, and the other protected
# branches (master, support/*), where every commit keeps its full pipeline.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE =~ /^(web|api|trigger)$/
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_REF_NAME != "develop"
      auto_cancel:
        on_new_commit: none
    - when: always

default:
  interruptible: true
  timeout: 30m

image: maven:3.10.0-eclipse-temurin-21@sha256:9b4877723dadf350b452dd97d9a6401e7b56f98fa9dfe420c32ad909989c7e4c

variables:
  MAVEN_CLI_OPTS: "-s .m2/settings.xml -Dsettings.security=.m2/settings-security.xml -P!devtools --batch-mode --show-version"
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.color=false -Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_REPO_PATH: ".m2/repository"
  SAST_PULL_ANALYZER_IMAGES: "0"
  SAST_RUN_ANALYZER_TIMEOUT: 30m
  SONAR_OPTS: "-Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.organization=$SONAR_ORGANIZATION -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  SKIP_TESTS: "-DskipTests"
  IT_OPTS: "-Dskip.junit=true -Dskip.selenium=false -DgenerateIntegrationReport=true"
  UT_OPTS: "-Dskip.frontend=true -DgenerateUnitReport=true -pl !awe-framework/awe-boot-angular-archetype -pl !awe-framework/awe-boot-react-archetype"
  DEPLOY_OPTS: "-f awe-framework/pom.xml -DskipTests -Darchetype.test.skip=true -Dskip.javadoc=false -Dbuild.environment=production"
  CI_PROJECT_URL_SSH: "origin git@gitlab.com:aweframework/awe.git"
  SPRING_PROFILES_ACTIVE: gitlab-ci
  KUBERNETES_PROJECT_ID: wired-armor-229610
  KUBERNETES_CLUSTER_NAME: awe-boot-cluster
  API_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID"
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the sonar task.
  # Security config
  DAST_WEBSITE: "https://staging.aweframework.com"
  DAST_TARGET_AVAILABILITY_TIMEOUT: 180
  DAST_BROWSER_SCAN: "true"
  DS_EXCLUDED_ANALYZERS: "gemnasium, gemnasium-python"

cache:
  - &cache-maven-repository   # reused by the jobs that declare a cache of their own, which replaces this one
    key: ${CI_COMMIT_REF_SLUG}
    policy: pull
    fallback_keys:
      - develop
    paths:
      - .m2/repository/

stages:
  - build
  - test
  - integration test
  - analysis
  - site
  - package
  - deploy
  - dast
  - release

.git_credentials_template: &git_credentials
  before_script:
    ## Push git credentials
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config --global user.email awe@almis.com
    - git config --global user.name "AWE Robot"
    - git remote set-url $CI_PROJECT_URL_SSH

##############################
# Pipeline rules
##############################

# A pipeline schedule that sets RENOVATE_RUN=true runs only the "Renovate" job. Every other
# job selects itself through the anchors below and excludes that variable here, so the regular
# "Weekly Check" schedule (which does not set it) still runs the full pipeline.
.if-default: &if-default
  if: '$RENOVATE_RUN != "true" && ($CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_REF_NAME == "develop" || $CI_COMMIT_REF_NAME =~ /^support\// || $CI_MERGE_REQUEST_IID)'
.if-master: &if-master
  if: '$RENOVATE_RUN != "true" && $CI_COMMIT_REF_NAME == "master"'
.if-develop: &if-develop
  if: '$RENOVATE_RUN != "true" && $CI_COMMIT_REF_NAME == "develop"'
.if-support: &if-support
  if: '$RENOVATE_RUN != "true" && $CI_COMMIT_REF_NAME =~ /^support\//'
.if-merge-request: &if-merge-request
  if: '$CI_MERGE_REQUEST_IID'
.if-tag: &if-tag
  if: '$CI_COMMIT_TAG'
.if-develop-schedule: &if-develop-schedule   # a pipeline schedule on develop (see .rules-selenium)
  if: '$RENOVATE_RUN != "true" && $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_REF_NAME == "develop"'

# Path selection for merge-request pipelines only: rules:changes is only reliable when compared
# against the MR target branch. Branch pipelines (develop/master/support/*) always run the full
# set through .if-branches below, regardless of what changed.
# rules:changes globs are evaluated with Ruby's File.fnmatch (FNM_PATHNAME): "dir/**" matches only
# one path segment below dir, so nested files need "dir/**/*". Keep every directory entry in
# that form, otherwise a change in a nested file selects no job (or breaks the pipeline through
# "needs" on a job that was not selected).
.paths-backend: &paths-backend
  - .gitlab-ci.yml
  - pom.xml
  - .m2/**/*
  - awe-framework/pom.xml
  - awe-framework/awe-dependencies/**/*
  - awe-framework/awe-model/**/*
  - awe-framework/awe-generic-screens/**/*
  - awe-framework/awe-controller/**/*
  - awe-framework/awe-testing/**/*
  - awe-framework/awe-modules/**/*
  - awe-framework/awe-starters/**/*
  - awe-framework/awe-boot-angular-archetype/**/*
  - awe-framework/awe-boot-react-archetype/**/*
  - awe-tests/**/*
  - awe-samples/**/*
.paths-frontend: &paths-frontend
  - .gitlab-ci.yml
  - awe-framework/awe-client-angular/**/*
.paths-frontend-react: &paths-frontend-react
  - .gitlab-ci.yml
  - awe-framework/awe-client-react/**/*
.paths-angular-templates: &paths-angular-templates   # served by TemplateController and compared by awe-boot unit tests
  - awe-framework/awe-client-angular/src/main/resources/templates/**/*
.paths-react-it: &paths-react-it   # .paths-backend plus the React client: keep both lists in step
  - .gitlab-ci.yml
  - pom.xml
  - .m2/**/*
  - awe-framework/pom.xml
  - awe-framework/awe-dependencies/**/*
  - awe-framework/awe-model/**/*
  - awe-framework/awe-generic-screens/**/*
  - awe-framework/awe-controller/**/*
  - awe-framework/awe-testing/**/*
  - awe-framework/awe-modules/**/*
  - awe-framework/awe-starters/**/*
  - awe-framework/awe-boot-angular-archetype/**/*
  - awe-framework/awe-boot-react-archetype/**/*
  - awe-framework/awe-client-react/**/*
  - awe-tests/**/*
  - awe-samples/**/*
.paths-website: &paths-website
  - .gitlab-ci.yml
  - website/**/*
  - bin/website-maintenance-docs.sh

.if-mr-backend: &if-mr-backend
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-backend
.if-mr-frontend: &if-mr-frontend
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-frontend
.if-mr-frontend-react: &if-mr-frontend-react
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-frontend-react
.paths-code: &paths-code             # backend or frontend: the whole Maven reactor
  - .gitlab-ci.yml
  - pom.xml
  - .m2/**/*
  - awe-framework/**/*
  - awe-tests/**/*
  - awe-samples/**/*
.if-mr-code: &if-mr-code
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-code
.if-mr-angular-templates: &if-mr-angular-templates
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-angular-templates
.if-mr-react-it: &if-mr-react-it
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-react-it
.if-mr-website: &if-mr-website
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-website
.if-branches: &if-branches           # develop, master, support/*: always complete
  if: '$RENOVATE_RUN != "true" && ($CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_REF_NAME == "develop" || $CI_COMMIT_REF_NAME =~ /^support\//)'
# "All UT" (the adapter unit tests, which need the Chromium browser): AngularJS templates are compared by awe-boot unit tests,
# so a frontend-only merge request that changes them can break it
.rules-all-ut: &rules-all-ut
  - <<: *if-mr-backend
  - <<: *if-mr-angular-templates
  - <<: *if-branches
# Browser suites (#812). Two tools run the same suites and both block the pipeline wherever they run:
#   - Playwright (the "Playwright ... IT" jobs) is the tool of the everyday pipeline: merge requests with code changes, develop
#     and master. It has no support/* rule: support/4.x has no Playwright adapter;
#   - Selenium (the "Chrome IT" and "Firefox IT" jobs) is the reference tool and runs less often: master, support/*, and the
#     pipelines of a pipeline schedule on develop: the "Weekly Check" schedule (CI/CD > Schedules, a project setting, not a
#     file of the repository). The "Renovate" schedule sets RENOVATE_RUN=true and runs only the Renovate job.
# A pipeline where both tools run (master, the weekly schedule on develop) gates "Launch Sonar" with both.
.rules-playwright: &rules-playwright
  - <<: *if-mr-code
  - <<: *if-develop
  - <<: *if-master
.rules-playwright-react: &rules-playwright-react   # the React application: the merge requests that change the backend or the React client
  - <<: *if-mr-react-it
  - <<: *if-develop
  - <<: *if-master
.rules-selenium: &rules-selenium
  - <<: *if-master
  - <<: *if-support
  - <<: *if-develop-schedule

##############################
# Build stage
##############################

.build:
  stage: build
  needs: [ ]
  timeout: 20m
  script:
    - mvn $MAVEN_CLI_OPTS install $SKIP_TESTS
    - version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
    - echo "PROJECT_VERSION=$version" >> build.env
  rules:
    - <<: *if-mr-code
    - <<: *if-branches

# docker-tools images are pinned as tag@digest: the registry only publishes a
# "latest" tag (no immutable version tags), so the digest is what actually
# freezes the image; the "latest" part is kept only so the reference stays
# human-readable. Renovate (#761) tracks and updates these digests.
.build-website:
  image: registry.gitlab.com/aweframework/docker-tools/website-build:latest@sha256:1bf9d446f348326e4997d62d3890625e3d9b6993b3ab682600b67ac1f2e882d9
  stage: build
  needs: [ ]
  timeout: 20m
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/website/.npm"
  script:
    - npm --prefix website ci
  cache:
    key: website-npm-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - website-npm-develop
    paths:
      - website/.npm
  artifacts:
    paths:
      - website/build
    expire_in: 1 day

.renovate-image:
  image:
    name: ghcr.io/renovatebot/renovate:44@sha256:6f1f3e2d9d0c3f99aa1f61f7509d302185de7deb173ac8c5ff88a5ce283ec435   # major pin + digest; Renovate updates its own pin
    entrypoint: [""]

# Runs from the "Renovate" pipeline schedule only (variable RENOVATE_RUN=true); configuration lives
# in renovate.json. See "Dependency updates" in website/docs/guides/release-lines-and-support.md.
Renovate:
  extends: .renovate-image
  stage: build
  interruptible: false
  timeout: 1h
  needs: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_BASE_DIR: $CI_PROJECT_DIR/renovate
    RENOVATE_REPOSITORY_CACHE: enabled
    LOG_LEVEL: info
    FORCE_COLOR: "3"
  # RENOVATE_TOKEN (masked, protected project access token) and the optional
  # RENOVATE_GITHUB_COM_TOKEN come from CI variables. Set RENOVATE_DRY_RUN=full on the
  # schedule to rehearse a run without opening merge requests.
  script:
    - renovate
  # The RENOVATE_TOKEN variable is scoped to this environment so that no other job on a
  # protected ref receives it (build jobs execute dependency code).
  environment:
    name: renovate
    action: prepare
  cache:
    key: renovate
    paths:
      - renovate/cache/renovate/repository/
    when: always
  resource_group: renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'

# Validates renovate.json (repository config, strict) on merge requests that change it.
Validate renovate config:
  extends: .renovate-image
  stage: build
  needs: []
  timeout: 10m
  script:
    - renovate-config-validator --strict
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - renovate.json

Build project:
  extends: .build
  script:
    - mvn $MAVEN_CLI_OPTS install $SKIP_TESTS
    # Aggregate CycloneDX SBOM for the whole reactor (only this job publishes it; the jdk 21
    # variant builds the same reactor and would only duplicate the report).
    - mvn $MAVEN_CLI_OPTS -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DoutputName=awe-sbom
    - version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
    - echo "PROJECT_VERSION=$version" >> build.env
  # Keep the cache small: drop the awe-boot fat jar (~250MB per version) and stale AWE snapshots
  # before the cache is archived. Otherwise it grows on every release until the runner runs out of disk.
  after_script:
    - version=$(sed -n 's/^PROJECT_VERSION=//p' build.env 2>/dev/null)
    - rm -rf .m2/repository/com/almis/awe/awe-boot .m2/repository/com/almis/awe/awe-boot-react
    - >-
      if [ -n "$version" ]; then
      find .m2/repository/com/almis/awe -mindepth 2 -maxdepth 2 -type d -name '*-SNAPSHOT' ! -name "$version"
      -exec rm -rf {} +; fi
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - awe-tests/awe-boot/target/awe-boot.jar
      # AWE modules installed by this build, consumed by the browser testing jobs
      - .m2/repository/com/almis/awe/
      # React client bundle: awe-tests/awe-boot-react consumes it from disk (file: npm dependency),
      # not from the Maven repository, so the React browser suites need it as an artifact. If it is
      # missing, the "require react client dist" enforcer rule of that module fails at initialize.
      - awe-framework/awe-client-react/dist/
      # Aggregate SBOM: kept as a plain artifact and attached to the image by "Build package".
      # It is deliberately NOT declared as a "reports: cyclonedx" artifact: GitLab's dependency
      # list requires its own CycloneDX properties (gitlab:meta:schema_version, input_file:path)
      # and flags "Error parsing SBOM reports" otherwise; the gemnasium job already feeds the
      # dependency list with a GitLab-formatted SBOM of the same Maven reactor.
      - target/awe-sbom.json
    expire_in: 1 day
  cache:
    - key: ${CI_COMMIT_REF_SLUG}
      policy: pull-push
      fallback_keys:
        - develop
      paths:
        - .m2/repository/

Build project:jdk 21:
  extends: .build
  image: maven:3.10.0-eclipse-temurin-21@sha256:9b4877723dadf350b452dd97d9a6401e7b56f98fa9dfe420c32ad909989c7e4c
  variables:
    SKIP_TESTS: "-DskipTests -Dskip.delombok=true"

Build website:
  extends: .build-website
  script:
    - npm --prefix website ci
    # Inject the live 4.x maintenance-line docs (support/4.x) as a versioned snapshot
    # before building, so the MR pipeline validates the same injection used in production.
    - chmod +x ./bin/website-maintenance-docs.sh
    - ./bin/website-maintenance-docs.sh
    - npm --prefix website run build
  rules:
    - <<: *if-mr-website

Build website with i18n:
  extends: .build-website
  interruptible: false
  script:
    - npm --prefix website ci
    # Inject the live 4.x maintenance-line docs (support/4.x) as a versioned snapshot before
    # building, so Crowdin syncs its sources too and the published site tracks support/4.x.
    - chmod +x ./bin/website-maintenance-docs.sh
    - ./bin/website-maintenance-docs.sh
    # Do translations
    - npm --prefix website run crowdin:sync
    - npm --prefix website run build
  resource_group: crowdin
  # Support branches are intentionally excluded: no Crowdin sync for maintenance lines.
  rules:
    - <<: *if-develop
    - <<: *if-master

##############################
# Playwright browsers
##############################

# The Playwright adapter of awe-testing (#812) drives a browser that Playwright installs itself. Two kinds of job use it:
# the unit tests of the adapter ("All UT", Chromium) and the browser suites ("Playwright ... IT", Chromium or
# Firefox). Each one installs only the browser it needs, with the CLI of the same Playwright version as the project, so
# there is one definition of the install (this one).
#
# The browser files are cached per browser. A cache is separated between protected branches and merge requests, so a job
# of develop cannot fill the cache of a merge request: one small job per pipeline ("Playwright Chromium browser",
# "Playwright Firefox browser") downloads the browser and pushes it, and the jobs that use the browser only pull it. A
# job that finds no browser in the cache downloads it itself, so a cold or failed cache costs time, never a failure. The
# cache job starts from nothing every time, so it always holds the revision of the current Playwright version and the
# revisions of older versions never pile up.
#
# The cache key follows the Playwright version through the hash of awe-dependencies/pom.xml, which declares it (a cache key
# cannot use a value that a script reads, so the version itself cannot be the key). Merge requests that pin different
# versions then do not overwrite each other's cache. The trade-off: any other change to that pom renews the key too, and the
# cache job fills the new one.
#
# Which browser a job installs is set by one of the two templates below (.playwright-chromium, .playwright-firefox), used by
# the cache job and by the jobs that use the browser, so that the two cannot drift apart.
.playwright-chromium:
  variables:
    PLAYWRIGHT_BROWSER: chromium                      # names the cache: playwright-chromium or playwright-firefox
    PLAYWRIGHT_INSTALL_ARGS: "--only-shell chromium"  # the headless shell of Chromium is about 200 MB; Playwright downloads three browsers (about 1 GB) otherwise

.playwright-firefox:
  variables:
    PLAYWRIGHT_BROWSER: firefox
    PLAYWRIGHT_INSTALL_ARGS: firefox

.playwright-install:
  variables:
    # Browsers of the tests that run through Playwright (they never download one). Kept under the project so the cache can store them
    PLAYWRIGHT_BROWSERS_PATH: "$CI_PROJECT_DIR/.playwright-browsers"
    PLAYWRIGHT_INSTALL_DEPS: "--with-deps"            # system libraries (apt: the job runs as root on Ubuntu); the cache job leaves them out
  # A job cache replaces the global one, so the Maven repository is declared again
  cache:
    - *cache-maven-repository
    - key:
        prefix: playwright-${PLAYWRIGHT_BROWSER}
        files:
          - awe-framework/awe-dependencies/pom.xml
      policy: pull
      paths:
        - .playwright-browsers/
  before_script:
    # The version of Playwright is the one that awe-dependencies declares, and the dependency plugin version is the one that the
    # root pom pins: the three jars of the CLI are fetched alone (a Maven exec on awe-testing would need the whole reactor built)
    - PLAYWRIGHT_VERSION=$(sed -n 's:.*<playwright.version>\(.*\)</playwright.version>.*:\1:p' awe-framework/awe-dependencies/pom.xml)
    - DEPENDENCY_PLUGIN_VERSION=$(sed -n 's:.*<plugin-dependency.version>\(.*\)</plugin-dependency.version>.*:\1:p' pom.xml)
    - test -n "$PLAYWRIGHT_VERSION" && test -n "$DEPENDENCY_PLUGIN_VERSION"
    - mvn $MAVEN_CLI_OPTS -N org.apache.maven.plugins:maven-dependency-plugin:${DEPENDENCY_PLUGIN_VERSION}:get -Dartifact=com.microsoft.playwright:playwright:${PLAYWRIGHT_VERSION} -Dtransitive=true
    - PLAYWRIGHT_JARS=$MAVEN_REPO_PATH/com/microsoft/playwright
    - java -cp "$PLAYWRIGHT_JARS/playwright/$PLAYWRIGHT_VERSION/playwright-$PLAYWRIGHT_VERSION.jar:$PLAYWRIGHT_JARS/driver/$PLAYWRIGHT_VERSION/driver-$PLAYWRIGHT_VERSION.jar:$PLAYWRIGHT_JARS/driver-bundle/$PLAYWRIGHT_VERSION/driver-bundle-$PLAYWRIGHT_VERSION.jar" com.microsoft.playwright.CLI install $PLAYWRIGHT_INSTALL_DEPS $PLAYWRIGHT_INSTALL_ARGS

.playwright-browser-cache:
  extends: .playwright-install
  stage: build
  needs: [ ]
  timeout: 10m
  allow_failure: true   # the jobs that use the browser download it when the cache is empty
  variables:
    PLAYWRIGHT_INSTALL_DEPS: ""
  cache:
    - *cache-maven-repository
    - key:
        prefix: playwright-${PLAYWRIGHT_BROWSER}
        files:
          - awe-framework/awe-dependencies/pom.xml
      policy: push
      paths:
        - .playwright-browsers/
  script:
    - du -sh .playwright-browsers/*

# Chromium: the adapter unit tests ("All UT") and the Chromium suites need it, so the rules are both lists. Both are automatic
# in every pipeline where a consumer runs (a merge request with code changes, develop, master), so none of them waits for a
# cache job that does not exist
Playwright Chromium browser:
  extends:
    - .playwright-browser-cache
    - .playwright-chromium
  rules:
    - !reference [.rules-all-ut]
    - !reference [.rules-playwright]

# Firefox: only the Playwright suites need it, so it follows their rules
Playwright Firefox browser:
  extends:
    - .playwright-browser-cache
    - .playwright-firefox
  rules: *rules-playwright

##############################
# testing stage
##############################

# Unit testing extension
.unit-testing:
  stage: test
  allow_failure: false
  timeout: 20m
  needs:
    - job: Build project
      artifacts: false
  variables:
    TZ: Europe/Madrid
  script:
    - mvn $MAVEN_CLI_OPTS verify $UT_OPTS -P$TEST_NAME -Djacoco.file.name=jacoco-${TEST_NAME}-ut.exec -Doracle.jdbc.J2EE13Compliant=true -Doracle.jdbc.timezoneAsRegion=false
  rules:
    - <<: *if-mr-backend
    - <<: *if-branches
  artifacts:
    paths:
      - "**/target/*.exec"
      - "**/target/surefire-reports"
      - "**/target/zerocode*.csv"
    when: always
    expire_in: 1 day
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"

All UT:
  extends:
    - .unit-testing
    - .playwright-install   # Chromium for the adapter tests of awe-testing: variables, cache (read only) and install
    - .playwright-chromium
  script:
    # The Playwright tests must run here: without the browser they fail instead of being skipped as they are on a developer
    # machine, so the coverage that Sonar reads for the adapter is real and cannot stop silently
    - mvn $MAVEN_CLI_OPTS verify $UT_OPTS -Djacoco.file.name=jacoco-all-ut.exec -Dawe.test.playwright.required=true
  # Also on AngularJS template changes: awe-boot unit tests compare templates served by TemplateController
  # (src/test/resources/templates/*.txt), so a frontend-only merge request can break them.
  rules: *rules-all-ut

Embedded DB Tests:
  extends: .unit-testing
  parallel:
    matrix:
      - TEST_NAME: [ h2, h2-flyway, hsql-flyway ]

MySQL Tests:
  extends: .unit-testing
