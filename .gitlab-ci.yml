        TEST_NAME: chrome-regression-websocket-print
      - TEST_TAGS: SchedulerIT
        TEST_PORT: "6308"
        TEST_NAME: chrome-scheduler

# The browser suites against the React engine test application. Selenium runs them where it runs at all (see
# .rules-selenium); Playwright runs them on a merge request only when the backend or the React client changes, and a change
# limited to the AngularJS client does not select them.
# The React test application has its own IT classes, and they are migrated one by one to the semantic
# steps of SeleniumUtilities (#812): a React job runs only the classes listed in TEST_CLASSES (comma
# separated, as -Dit.test takes them), never a whole JUnit tag group, which would also run the classes
# that are not migrated yet. Add a class to the entry of its group when it is migrated, or add an entry
# (with its own port and name) when the group has none yet; the groups are:
#   ApplicationIntegrationIT: ApplicationSettingsTestsIT, ApplicationSecurityTestsIT, ApplicationEmailTestsIT,
#                             IntegrationTestsIT                                (port 6309 / 6313)
#   CRUDCriteriaMatrixIT: CRUDTestsIT, CriteriaTestsIT, ButtonTestsIT, MatrixTestsIT   (port 6310 / 6314)
#   RegressionWebsocketPrintIT: RegressionTestsIT, WebsocketTestsIT, PrintTestsIT   (port 6311 / 6315)
#   SchedulerIT: SchedulerTestsIT                                              (port 6312 / 6316)
# List .react-testing LAST in "extends": variables are merged and the last template that sets one wins, so another order
# would bring back the AngularJS test application. It sets no rules: the Selenium jobs take .rules-selenium from
# .browser-testing and the Playwright React jobs set .rules-playwright-react themselves.
.react-testing:
  variables:
    IT_APP_MODULE: awe-tests/awe-boot-react
    IT_SELECTION: -Dit.test=${TEST_CLASSES}

Firefox IT React:
  extends:
    - .firefox-testing
    - .react-testing
  parallel:
    matrix:
      - TEST_CLASSES: ApplicationSettingsTestsIT,ApplicationSecurityTestsIT,ApplicationEmailTestsIT,IntegrationTestsIT
        TEST_PORT: "6309"
        TEST_NAME: react-firefox-application-integration
      - TEST_CLASSES: CRUDTestsIT,CriteriaTestsIT,ButtonTestsIT,MatrixTestsIT
        TEST_PORT: "6310"
        TEST_NAME: react-firefox-crud-criteria-matrix
      - TEST_CLASSES: RegressionTestsIT,WebsocketTestsIT,PrintTestsIT
        TEST_PORT: "6311"
        TEST_NAME: react-firefox-regression-websocket-print
      - TEST_CLASSES: SchedulerTestsIT
        TEST_PORT: "6312"
        TEST_NAME: react-firefox-scheduler

Chrome IT React:
  extends:
    - .chrome-testing
    - .react-testing
  parallel:
    matrix:
      - TEST_CLASSES: ApplicationSettingsTestsIT,ApplicationSecurityTestsIT,ApplicationEmailTestsIT,IntegrationTestsIT
        TEST_PORT: "6313"
        TEST_NAME: react-chrome-application-integration
      - TEST_CLASSES: CRUDTestsIT,CriteriaTestsIT,ButtonTestsIT,MatrixTestsIT
        TEST_PORT: "6314"
        TEST_NAME: react-chrome-crud-criteria-matrix
      - TEST_CLASSES: RegressionTestsIT,WebsocketTestsIT,PrintTestsIT
        TEST_PORT: "6315"
        TEST_NAME: react-chrome-regression-websocket-print
      - TEST_CLASSES: SchedulerTestsIT
        TEST_PORT: "6316"
        TEST_NAME: react-chrome-scheduler

# Playwright browser suites (#812): the same suites as the Selenium jobs above, run with awe.test.tool=playwright in a local
# headless browser that the job installs next to the application it starts (Playwright has no service or remote browsers).
# They are the browser suites of the everyday pipeline, and so they:
#   - block the pipeline, with the one automatic retry of .browser-testing (#766), like the Selenium jobs;
#   - are needed by "Launch Sonar" (optional: a pipeline that does not run them takes the coverage of the Selenium jobs);
#   - run automatically on every merge request with code changes, on develop and on master, and never on support/*;
#   - write failure evidence to browser-evidence/ as the Selenium jobs do: the screenshot, page source and console of the
#     failure, the Playwright trace of the failed test and the page video of a class with a failure. The screen recorder of
#     the Selenium jobs is off (awe.test.allowed-recording=false): a headless browser has no screen to film.
# The suite groups, test names and ports follow the Selenium jobs (ports 6317 to 6332 are free, the Selenium jobs use 6301 to
# 6316). Compare a job with the Selenium job of the same suite through the failsafe summary and the last line of its log.
.playwright-testing:
  extends:
    - .browser-testing
    - .playwright-install
  variables:
    IT_TOOL_OPTS: -Dawe.test.tool=playwright -Dawe.test.allowed-recording=false
  # The fonts of the print tests, then the browser of this job
  before_script:
    - !reference [.browser-testing, before_script]
    - !reference [.playwright-install, before_script]
  after_script:
    - !reference [.browser-testing, after_script]
    - echo "Playwright ${TEST_NAME} (${BROWSER}), job status ${CI_JOB_STATUS}, $(( $(date +%s) - $(date -d "$CI_JOB_STARTED_AT" +%s) )) s since the job started"

.playwright-chromium-testing:
