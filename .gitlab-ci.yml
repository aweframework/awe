        TEST_PORT: "6326"
        TEST_NAME: playwright-react-chromium-crud-criteria-matrix
      - TEST_CLASSES: RegressionTestsIT,WebsocketTestsIT,PrintTestsIT
        TEST_PORT: "6327"
