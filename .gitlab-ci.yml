gemnasium-maven-dependency_scanning:
  stage: test
  timeout: 15m
  rules:
    - <<: *if-mr-code
    - <<: *if-branches
  dependencies: ["Build project"]
  needs:
    - job: Build project
  variables:
    MAVEN_CLI_OPTS: "-DskipTests --batch-mode"

# Runs on every merge request that touches code or the website, and on every branch pipeline.
secret_detection:
  needs: [ ]
  timeout: 15m
  # Never auto-cancelled, on any ref (see workflow): on develop a newer pipeline does not scan the commits of an older one;
  # on a merge request the cost is this short job finishing in a superseded pipeline
  interruptible: false
  rules:
    - <<: *if-mr-code
    - <<: *if-mr-website
    - <<: *if-branches

##############################
# Analysis stage
##############################

Launch Sonar:
  image: registry.gitlab.com/aweframework/docker-tools/sonar:latest@sha256:8fb0e07eaf7c9f935c461599bcde7ac7714ac8a9cc3def02ee97195094316c0c
  stage: analysis
  timeout: 20m
  # Some needs are optional: a merge-request pipeline may run Sonar (backend or frontend changed)
  # without running the narrower backend-only or frontend-only job groups.
  needs:
    - job: All UT
      optional: true
    - job: Embedded DB Tests
      optional: true
    - job: MySQL Tests
      optional: true
    - job: PostgreSQL Tests
      optional: true
    - job: Oracle Tests
      optional: true
    - job: SQL Server Tests
      optional: true
    - job: Frontend UT
      optional: true
    - job: Frontend UT React
      optional: true
    # The browser suites: Playwright runs on merge requests, develop and master; Selenium on master, support/* and the
    # pipeline schedule of develop. Each pipeline runs at least one tool (the React jobs of a tool also depend on the
    # changed paths), so every job is optional; whichever job runs gates Sonar (and the release jobs). Keep it so:
    # .rules-playwright and .rules-selenium together must cover every pipeline that runs this job, or Sonar and the
    # releases go ahead with no browser suite. Their IT coverage reaches Sonar as before: the *.exec files of both tools
    # have different names (jacoco-${TEST_NAME}-it.exec), so both sets are kept when both tools ran.
    - job: Playwright Chromium IT
      optional: true
    - job: Playwright Firefox IT
      optional: true
    - job: Playwright Chromium IT React
      optional: true
    - job: Playwright Firefox IT React
      optional: true
    - job: Firefox IT
      optional: true
    - job: Chrome IT
      optional: true
    - job: Firefox IT React
      optional: true
    - job: Chrome IT React
      optional: true
  cache:
    - key: ${CI_COMMIT_REF_SLUG}
      policy: pull
      paths:
        - .m2/repository/
    - key: ${CI_JOB_NAME}
      paths:
        - .sonar/cache
  script:
    # A merge-request pipeline that did not run "Frontend UT" or "Frontend UT React" (backend-only
    # change, or a change to only one of the two clients) has no Jest report directory for that
    # client at all, and the Sonar scanner fails on a missing generic test execution report
    # (sonar.testExecutionReportPaths in the root pom and in each client pom). Only in that case
    # provide an empty but valid report so the Java analysis still runs. If the directory exists
    # (the job ran) but the report is missing, fail loudly instead of hiding a broken artifact.
    - |
      for JEST_REPORTS_DIR in awe-framework/awe-client-angular/target/reports/jest awe-framework/awe-client-react/target/reports/jest; do
        if [ ! -d "$JEST_REPORTS_DIR" ]; then
          mkdir -p "$JEST_REPORTS_DIR/sonar"
          echo '<testExecutions version="1"></testExecutions>' > "$JEST_REPORTS_DIR/sonar/javascriptUnitTests.xml"
          echo "The frontend unit tests for $JEST_REPORTS_DIR were not part of this pipeline: Sonar runs with an empty Jest report"
        elif [ ! -f "$JEST_REPORTS_DIR/sonar/javascriptUnitTests.xml" ]; then
          echo "The frontend unit tests ran but their Sonar report is missing under $JEST_REPORTS_DIR" >&2
          exit 1
        fi
      done
    # SonarCloud rejects branch parameters on merge request analyses, so only set sonar.branch.name outside MRs.
    - SONAR_BRANCH_OPTS=""
    - if [ -z "$CI_MERGE_REQUEST_IID" ]; then SONAR_BRANCH_OPTS="-Dsonar.branch.name=$CI_COMMIT_REF_NAME"; fi
    # Dependency scanning is done by GitLab's gemnasium job and the CycloneDX SBOM, not by the
    # (unused) OWASP dependency-check Maven plugin, so its flag is not passed here.
    - mvn $MAVEN_CLI_OPTS verify -Dskip.frontend=true -DgenerateCoverageReport=true sonar:sonar $SKIP_TESTS -Darchetype.test.skip=true $SONAR_OPTS $SONAR_BRANCH_OPTS
    - cat awe-tests/awe-boot/target/coverage-reports/index.html | grep -o 'Total[^%]*%' | sed -e 's/Total/Jacoco-Test-Coverage:/g'
  artifacts:
    paths:
      - awe-tests/awe-boot/target/coverage-reports/
    expire_in: 1 week
  rules:
    - <<: *if-mr-code
    - <<: *if-branches

##############################
# Site stage
##############################

Generate javadoc & schemas:
  stage: site
  needs: [ ]
  timeout: 20m
  script:
    - mvn $MAVEN_CLI_OPTS install site javadoc:aggregate $SKIP_TESTS -Darchetype.test.skip=true -Dskip.javadoc=false -Dskip.main=true -Dskip.frontend=true -Dbuild.environment=production -f awe-framework/pom.xml
    # maven-javadoc-plugin 3.12.0 writes the aggregate to target/reports/apidocs (3.5.0 used target/site/apidocs): fail here, not
    # in pages, if a plugin update moves it again
    - test -f awe-framework/target/reports/apidocs/index.html
  artifacts:
    paths:
      - awe-framework/target/reports/apidocs
      - awe-framework/awe-generic-screens/src/main/resources/schemas/
    expire_in: 1 day
  rules:
    - <<: *if-master
    - <<: *if-develop
    - <<: *if-support

##############################
# Package stage
##############################

# The React test application jar for the "awe-boot-react" image. "Build project" artifacts only the awe-boot jar (every
# test job downloads that job's artifacts, so a second ~250MB jar would be downloaded dozens of times); this job packages
# the React application from the modules and the client bundle that "Build project" already built, and runs on the
# branches that publish images only.
Build React package:
  stage: package
  interruptible: false
  timeout: 20m
  needs:
    - job: Build project
      artifacts: true
  script:
    - mvn -f awe-tests/awe-boot-react/pom.xml $MAVEN_CLI_OPTS package $SKIP_TESTS
    - test -f awe-tests/awe-boot-react/target/awe-react.jar
  artifacts:
    paths:
      - awe-tests/awe-boot-react/target/awe-react.jar
    expire_in: 1 day
  rules:
    - <<: *if-develop
    - <<: *if-master
    - <<: *if-support

Build package:
  image: docker:28.5.2-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
  stage: package
  cache: { }
  interruptible: false
  timeout: 15m
  # Keyless cosign signing: GitLab issues an OIDC token scoped to the "sigstore" audience,
  # cosign uses it to sign/attest against public Sigstore infrastructure with no stored key.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
  needs:
    - job: Build project
      artifacts: true
    - job: Launch Sonar
      artifacts: false
    - job: Build React package
      artifacts: true
  services:
    - docker:28.5.2-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
  before_script:
    - apk add --no-cache cosign
  script:
    # Gitlab container
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    - docker build -t registry.gitlab.com/aweframework/awe/awe-boot:$PROJECT_VERSION ./awe-tests/awe-boot
    - docker push registry.gitlab.com/aweframework/awe/awe-boot:$PROJECT_VERSION
    - digest=$(docker images registry.gitlab.com/aweframework/awe/awe-boot --format="{{.Digest}}" --digests)
    - echo "PACKAGE_DIGEST=$digest" >> build.env
    # Sign the image once by digest (every floating tag pushed below shares it) and attest the
    # SBOM built by "Build project" against the same digest.
    - GITLAB_IMAGE_DIGEST_REF="registry.gitlab.com/aweframework/awe/awe-boot@${digest}"
    - cosign sign "$GITLAB_IMAGE_DIGEST_REF"
    - cosign attest --type cyclonedx --predicate target/awe-sbom.json "$GITLAB_IMAGE_DIGEST_REF"
    # Docker Hub container
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_TOKEN
    - docker build -t aweframework/awe-boot:$PROJECT_VERSION ./awe-tests/awe-boot
    - docker push aweframework/awe-boot:$PROJECT_VERSION
    # RepoDigests lists one entry per registry the image was pushed to; pick the Docker Hub one explicitly.
    - DOCKERHUB_IMAGE_DIGEST_REF=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' aweframework/awe-boot:$PROJECT_VERSION | grep '^aweframework/awe-boot@' | head -n1)
    - test -n "$DOCKERHUB_IMAGE_DIGEST_REF" || { echo "Docker Hub digest not found for aweframework/awe-boot:$PROJECT_VERSION"; exit 1; }
    - cosign sign "$DOCKERHUB_IMAGE_DIGEST_REF"
    # React test application image (awe-boot-react), built, signed and attested like awe-boot. No deploy job uses it.
    # The digest is read from RepoDigests of the pushed image, so it is exactly the one that was pushed.
    - docker build -t registry.gitlab.com/aweframework/awe/awe-boot-react:$PROJECT_VERSION ./awe-tests/awe-boot-react
    - docker push registry.gitlab.com/aweframework/awe/awe-boot-react:$PROJECT_VERSION
    - GITLAB_REACT_IMAGE_DIGEST_REF=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' registry.gitlab.com/aweframework/awe/awe-boot-react:$PROJECT_VERSION | grep '^registry.gitlab.com/aweframework/awe/awe-boot-react@' | head -n1)
    - test -n "$GITLAB_REACT_IMAGE_DIGEST_REF" || { echo "GitLab registry digest not found for awe-boot-react:$PROJECT_VERSION"; exit 1; }
    - echo "PACKAGE_REACT_DIGEST=${GITLAB_REACT_IMAGE_DIGEST_REF#*@}" >> build.env
    - cosign sign "$GITLAB_REACT_IMAGE_DIGEST_REF"
    - cosign attest --type cyclonedx --predicate target/awe-sbom.json "$GITLAB_REACT_IMAGE_DIGEST_REF"
    # Docker Hub: the same image (no second build), pushed and signed by digest (both registries are logged in above).
    - docker tag registry.gitlab.com/aweframework/awe/awe-boot-react:$PROJECT_VERSION aweframework/awe-boot-react:$PROJECT_VERSION
    - docker push aweframework/awe-boot-react:$PROJECT_VERSION
    - DOCKERHUB_REACT_IMAGE_DIGEST_REF=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' aweframework/awe-boot-react:$PROJECT_VERSION | grep '^aweframework/awe-boot-react@' | head -n1)
    - test -n "$DOCKERHUB_REACT_IMAGE_DIGEST_REF" || { echo "Docker Hub digest not found for aweframework/awe-boot-react:$PROJECT_VERSION"; exit 1; }
    - cosign sign "$DOCKERHUB_REACT_IMAGE_DIGEST_REF"
    # Support branches (maintenance lines) also get floating major and major.minor tags, never "latest".
    - |
      if [[ "$CI_COMMIT_REF_NAME" == support/* ]]; then
        CLEAN_VERSION="${PROJECT_VERSION%-SNAPSHOT}"
        MAJOR_VERSION="${CLEAN_VERSION%%.*}"
        MAJOR_MINOR_VERSION="${CLEAN_VERSION%.*}"
        for TAG in "$MAJOR_VERSION" "$MAJOR_MINOR_VERSION"; do
          for IMAGE in awe-boot awe-boot-react; do
            docker tag registry.gitlab.com/aweframework/awe/$IMAGE:$PROJECT_VERSION registry.gitlab.com/aweframework/awe/$IMAGE:$TAG
            docker push registry.gitlab.com/aweframework/awe/$IMAGE:$TAG
            docker tag aweframework/$IMAGE:$PROJECT_VERSION aweframework/$IMAGE:$TAG
            docker push aweframework/$IMAGE:$TAG
          done
        done
      fi
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - <<: *if-develop
    - <<: *if-master
    - <<: *if-support

# Scans the image just pushed by "Build package". allow_failure is true for the first weeks
# after adoption, so findings are visible without blocking releases; tighten once triaged.
container_scanning:
  stage: deploy
  timeout: 15m
  allow_failure: true
  needs:
    - job: Build package
  # The template sets "dependencies: []", which disables artifact download and therefore the
  # build.env dotenv from "Build package"; re-enable it so PACKAGE_DIGEST is available.
  dependencies:
    - Build package
  variables:
    # Scan exactly the image that was pushed and signed: by digest, taken from the build.env
    # dotenv that "Build package" exports (PACKAGE_DIGEST), never by a floating tag.
    CS_IMAGE: "$CI_REGISTRY_IMAGE/awe-boot@$PACKAGE_DIGEST"
  before_script:
    - |
      if [ -z "$PACKAGE_DIGEST" ]; then
        echo "PACKAGE_DIGEST is empty: the build.env dotenv from Build package was not received"
        exit 1
      fi
      export CS_IMAGE="$CI_REGISTRY_IMAGE/awe-boot@$PACKAGE_DIGEST"
      echo "Scanning $CS_IMAGE"
  rules:
    - <<: *if-develop
    - <<: *if-master
    - <<: *if-support

##############################
# Deploy stage
##############################

Deploy snapshot:
  stage: deploy
  interruptible: false
  timeout: 20m
  needs:
    - job: Launch Sonar
  script:
    - mvn $MAVEN_CLI_OPTS deploy $DEPLOY_OPTS
  rules:
    - <<: *if-develop
    - <<: *if-support

Deploy Maven Central:
  stage: deploy
  image: registry.gitlab.com/aweframework/docker-tools/ci-release:latest@sha256:3a9587bd84e1ca6ed0550701b3e7ee4b35f4c2c8b580d2aa286a48dd36911682
  interruptible: false
  timeout: 1h
  needs: [ ]
  before_script:
    ## Add gpg key to sign
    - gpg --batch --import <(echo "$GPG_PRIVATE_KEY")
  script:
    - mvn $MAVEN_CLI_OPTS deploy $DEPLOY_OPTS -DperformRelease=true
  rules:
    - <<: *if-tag

# Publishes the React client to npm as "awe-react-client", only from the tag pipelines of the 5.x line and later: support/4.x
# tags (v4.*) never publish it, because that line has no React client. The npm version is the tag without the "v", which is also
# the Maven project version of the tagged commit: the job builds the client through Maven (the same pinned Node and npm as
# the other jobs), checks the generated dist/package.json against the tag, and publishes dist/ with an npm provenance
# statement (the job OIDC token, audience "sigstore", is what npm reads on GitLab). NPM_AUTH_TOKEN is a CI variable
# (protected, masked) that must be visible to tag pipelines. Prerelease versions (e.g. 5.1.0-rc.1) go to the "next" dist-tag, final
# versions to "latest". npm refuses to republish a version, so a rerun of a tag whose version already exists is a success.
Publish npm:
  stage: deploy
  interruptible: false
  timeout: 30m
  needs:
    - job: Deploy Maven Central
      artifacts: false
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    CLIENT_DIR: awe-framework/awe-client-react
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    # Install Node and npm (pinned in awe-dependencies), install the dependencies and build the client (compile phase only:
    # lint and unit tests already ran on the commit pipelines).
    - mvn -f $CLIENT_DIR/pom.xml $MAVEN_CLI_OPTS compile
    - export PATH="$CI_PROJECT_DIR/$CLIENT_DIR/node:$PATH"
    - cd $CLIENT_DIR
    # Fail unless the generated package carries exactly the tag version (never publish a stale or SNAPSHOT version).
    - AWE_VERSION="$VERSION" npm run verify:version
    # CycloneDX SBOM of the runtime dependencies of the client, labelled with the released version.
    - npm pkg set version="$VERSION"
    - npm sbom --sbom-format cyclonedx --sbom-type library --omit dev > "$CI_PROJECT_DIR/awe-react-client-sbom.json"
    # npm names the root component after the folder (awe-client-react): set the package name.
    - |
      node -e 'const fs = require("fs"); const f = process.argv[1]; const bom = JSON.parse(fs.readFileSync(f, "utf8"));
      bom.metadata.component.name = "awe-react-client"; fs.writeFileSync(f, JSON.stringify(bom, null, 2) + "\n");' "$CI_PROJECT_DIR/awe-react-client-sbom.json"
    - cd "$CI_PROJECT_DIR"
    # Idempotency: npm cannot republish a version. A version that is not published yet gives no output: npm 11 exits
    # with E404, some older npm versions exit 0. Any other answer or failure stops the job.
    - |
      view_rc=0
      existing=$(npm view "awe-react-client@${VERSION}" version 2>npm-view.err) || view_rc=$?
      if [ "$existing" = "$VERSION" ]; then
        echo "awe-react-client@${VERSION} is already published: nothing to do"
        exit 0
      fi
      if [ -n "$existing" ] || { [ "$view_rc" -ne 0 ] && ! grep -q E404 npm-view.err; }; then
        echo "Cannot tell whether awe-react-client@${VERSION} exists:"
        cat npm-view.err
        exit 1
      fi
    # The token reaches npm through the environment: the line below is written literally and npm expands it.
    - printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_AUTH_TOKEN}' > "$HOME/.npmrc"
    - |
      case "$VERSION" in
        *-*) NPM_TAG=next ;;
        *) NPM_TAG=latest ;;
      esac
    - echo "Publishing awe-react-client@${VERSION} with dist-tag ${NPM_TAG}"
    # "./" is mandatory: a bare "dist" or "a/b/dist" could be read by npm as a registry package or a git shorthand, not a folder.
    - npm publish "./$CLIENT_DIR/dist" --provenance --access public --tag "$NPM_TAG"
  after_script:
    - rm -f "$HOME/.npmrc"
  artifacts:
    paths:
      - awe-react-client-sbom.json
    # The SBOM is the record of what the published version contains, so it is kept like the release itself.
    expire_in: never
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v([5-9]|[1-9][0-9]+)\./'

# Kubernetes deployment
.k8s_deploy:
  image: registry.gitlab.com/aweframework/docker-tools/ci-utilities:latest@sha256:823e0e37eaebd96a136475f4a626fd851f36a313175e06afd252c01567ed5ea7
  cache: { }
  interruptible: false
  timeout: 15m
  variables:
    GIT_STRATEGY: none
  needs:
    - job: Build project
    - job: Launch Sonar
      artifacts: false
    - job: Build package
  stage: deploy
  script:
    - git clone ${GIT_REPO_AWE_CONFIG}
    - git config --global user.email ${GIT_REPO_CI_USER_EMAIL}
    - git config --global user.name "${GIT_REPO_CI_USER_NAME}"
    - cd awe-gke-config/manifests/${CI_ENVIRONMENT_SLUG}/awe-boot/kustomize
    - kustomize edit set image registry.gitlab.com/aweframework/awe/awe-boot@${PACKAGE_DIGEST}
    - kustomize edit set annotation version:${PROJECT_VERSION}
    - kustomize build -o awe-boot-deployment.yaml
    - git commit . -m "Updated awe-boot kubernetes deployment ${CI_ENVIRONMENT_SLUG}"
    - git push origin master

Deploy staging:
  extends: .k8s_deploy
  environment:
    name: staging
    url: https://staging.aweframework.com
    kubernetes:
      namespace: staging
  # Support branches are intentionally excluded: no k8s staging deployment for maintenance lines.
  rules:
    - <<: *if-develop

Deploy production:
  extends: .k8s_deploy
  environment:
    name: production
    url: https://demo.aweframework.com
    kubernetes:
      namespace: production
  # Support branches are intentionally excluded: no k8s production deployment for maintenance lines.
  rules:
    - <<: *if-master

dast:
  interruptible: false
  timeout: 15m
  script:
    - export DAST_WEBSITE=${DAST_WEBSITE:-$(cat environment_url.txt)}
    - if [ -z "$DAST_WEBSITE$DAST_API_SPECIFICATION" ]; then echo "Either DAST_WEBSITE or DAST_API_SPECIFICATION must be set. See https://docs.gitlab.com/ee/user/application_security/dast/#configuration for more details." && exit 1; fi
    - /analyze
  needs:
    - job: Deploy staging
  # Support branches are intentionally excluded: DAST only runs against the staging deployment.
  rules:
    - <<: *if-develop

pages:
  image: docker:28.5.2-cli@sha256:625d9431a9f54c5a2bc90f24f0e1c3d55b1349fd857dd85035f98c2c9acbdd4d
  stage: deploy
  cache: { }
  interruptible: false
  timeout: 15m
  needs:
    - job: Generate javadoc & schemas
    - job: Build website with i18n
  script:
    - mkdir -p .public/docs/schemas
    - cp -r awe-framework/target/reports/apidocs .public/javadoc-api/
    - cp -r awe-framework/awe-generic-screens/src/main/resources/schemas/awe/*.xsd .public/docs/schemas/
    - cp -a website/build/. .public/
    - mv .public public
  artifacts:
    paths:
      - public
    expire_in: 1 day
  # Support branches are intentionally excluded: Pages has a single site root, no per-branch publishing.
  rules:
    - <<: *if-master
    - <<: *if-develop

Generate release notes:
  image: registry.gitlab.com/aweframework/docker-tools/ci-release:latest@sha256:3a9587bd84e1ca6ed0550701b3e7ee4b35f4c2c8b580d2aa286a48dd36911682
  cache: { }
  interruptible: false
  dependencies: [ ]
  needs: [ ]
  stage: deploy
  script:
    - ./bin/release_notes.sh $API_URL $API_TOKEN "$CI_PROJECT_TITLE"
  artifacts:
    paths:
      - release_notes.md
    expire_in: 1 week
  rules:
    - <<: *if-tag

##############################
# Release stage
##############################

Generate a new milestone:
  image: registry.gitlab.com/aweframework/docker-tools/ci-utilities:latest@sha256:823e0e37eaebd96a136475f4a626fd851f36a313175e06afd252c01567ed5ea7
  stage: release
  interruptible: false
  needs: [ ]
  script:
    ## Generate milestones from the version being tagged, without checking out develop
    ## (a develop checkout would read the wrong version once develop moves to 5.0.0-SNAPSHOT).
    ## milestone.sh receives the released version and creates the next bugfix, minor and major milestones.
    - VERSION="${CI_COMMIT_TAG#v}"
    - chmod +x ./bin/milestone.sh
    - ./bin/milestone.sh $API_URL $API_TOKEN "$VERSION"
  rules:
    - <<: *if-tag

Start a new release:
  image: registry.gitlab.com/aweframework/docker-tools/ci-release:latest@sha256:3a9587bd84e1ca6ed0550701b3e7ee4b35f4c2c8b580d2aa286a48dd36911682
  cache: { }
  interruptible: false
  timeout: 1h
  dependencies: [ ]
  # Release gate: the manual job only becomes available once analysis, packaging and the
  # snapshot deploy of this commit have succeeded (what the stage order guaranteed before).
  needs:
    - job: Launch Sonar
      artifacts: false
    - job: Build package
      artifacts: false
    - job: Deploy snapshot
  stage: release
  <<: *git_credentials
  script:
    ## Generate release
    # Start from the pipeline commit even when the runner reuses its workspace (a leftover local
    # branch would otherwise become the release base).
    - git checkout -B "$CI_COMMIT_REF_NAME" "$CI_COMMIT_SHA"
    - chmod +x ./bin/release.sh
    - ./bin/release.sh $API_URL $API_TOKEN "$CI_PROJECT_TITLE"
    - git checkout ./bin/release.sh
    - git add ./CHANGELOG.md
    - git commit -m "Generated CHANGELOG"
    ## Generate new version of documentation if major or minor
    - chmod +x ./bin/docusaurus.sh
    - ./bin/docusaurus.sh
    ## Generate release: develop releases through gitflow:release (develop -> master),
    ## support branches release through the hotfix-based support-release.sh script.
    - |
      case "$CI_COMMIT_REF_NAME" in
        support/*)
          chmod +x ./bin/support-release.sh
          ./bin/support-release.sh
          ;;
        *)
          mvn -B gitflow:release -DskipTestProject=true -DpushRemote=true -DversionProperty=revision
          ;;
      esac
  variables:
    GIT_STRATEGY: clone
  rules:
    - <<: *if-develop
      when: manual
      allow_failure: true
    - <<: *if-support
      when: manual
      allow_failure: true

Notify new release:
  image: registry.gitlab.com/aweframework/docker-tools/ci-utilities:latest@sha256:823e0e37eaebd96a136475f4a626fd851f36a313175e06afd252c01567ed5ea7
  stage: release
  interruptible: false
  # Only announce a release whose artifacts and GitLab release actually exist.
  needs:
    - job: Deploy Maven Central
    - job: Generate gitlab release
  script:
    ## Generate milestone
    - chmod +x ./bin/sendmail.sh
    - ./bin/sendmail.sh $RELEASE_MAIL_TOKEN $RELEASE_MAIL_FROM $RELEASE_MAIL_TO $RELEASE_MAIL_TEMPLATE_ID
  rules:
    - <<: *if-tag
      when: delayed
      start_in: 20 minutes

Generate gitlab release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  interruptible: false
  needs:
    - job: Generate release notes
      artifacts: true
  rules:
    - <<: *if-tag
  script:
    - echo "Creating release"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: release_notes.md
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Container Image $CI_COMMIT_TAG'
          url: "https://$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA"
