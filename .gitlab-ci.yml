Javadoc test:
  stage: test
  timeout: 20m
  needs:
    - job: Build project
      artifacts: false
  script:
    - mvn -f awe-framework/pom.xml $MAVEN_CLI_OPTS javadoc:aggregate-no-fork -Dskip.javadoc=false -Ptest-javadoc
  artifacts:
    paths:
      - awe-framework/target/reports/apidocs
    expire_in: 1 day
  rules:
    - <<: *if-mr-backend

##############################
# Integration testing stage
##############################

# Browser testing extension
.browser-testing:
  image: maven:3.10.0-eclipse-temurin-21@sha256:9b4877723dadf350b452dd97d9a6401e7b56f98fa9dfe420c32ad909989c7e4c
  stage: integration test
  # The browser suites (Selenium and Playwright alike) block the pipeline, and therefore Renovate's
  # automerge and the release jobs that need Sonar. One automatic job retry absorbs an occasional
  # flaky run until per-test retry and a quarantine exist (#766); a real regression fails twice and
  # still blocks. The Playwright jobs inherit this policy.
  # Timeouts are not retried: a hung browser session should fail within one timeout window.
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
  timeout: 30m
  variables:
    # Test application that runs the suites: awe-tests/awe-boot (AngularJS) or awe-tests/awe-boot-react
    IT_APP_MODULE: awe-tests/awe-boot
    # What the job runs: the JUnit tag group of the matrix entry (TEST_TAGS) by default; the React jobs
    # run the IT classes of their matrix entry (TEST_CLASSES) instead
    IT_SELECTION: -Dgroups=${TEST_TAGS}
    # Extra options that choose the automation tool: empty for the Selenium jobs, the Playwright jobs set them
    IT_TOOL_OPTS: ""
    SCREEN_WIDTH: 1440
    SCREEN_HEIGHT: 1080
    FF_NETWORK_PER_BUILD: "true"
  # Artifacts provide the AWE snapshot modules built in this pipeline, independently of the cache state
  needs:
    - job: Build project
      artifacts: true
  # Important! Print/PDF IT tests render server-side and need system fonts.
  # eclipse-temurin is a minimal image, so install fontconfig + fonts here.
  before_script:
    - apt-get update -qq && apt-get install -y -qq fontconfig fonts-dejavu >/dev/null
  script:
    - mvn -f ${IT_APP_MODULE}/pom.xml $MAVEN_CLI_OPTS verify $IT_OPTS -Dawe.test.browser=${BROWSER} -Dawe.test.screenshot-path=${CI_PROJECT_DIR}/browser-evidence/ ${IT_SELECTION} ${IT_TOOL_OPTS} -Djacoco.file.name=jacoco-${TEST_NAME}-it.exec -Djacoco.port=$TEST_PORT
    - echo "I am going to wait for 10 seconds only to ensure .exec file generation"
    - sleep 10
  after_script:
    - |
      if [ -d browser-evidence ] && [ -n "$(find browser-evidence -type f 2>/dev/null | head -n 1)" ]; then
        echo "Browser test evidence (screenshots, traces and videos): ${CI_JOB_URL}/artifacts/browse/browser-evidence/"
        echo "Files in browser-evidence/: $(find browser-evidence -type f | wc -l)"
      fi
  # Failure evidence (screenshots, Playwright traces and videos) is written under browser-evidence/, at the artifact root.
  # It has no expose_as: GitLab does not display it when a path uses a CI variable, and the per-job
  # jacoco file name (needed by Launch Sonar) requires one.
  artifacts:
    paths:
      - browser-evidence/
      - ${IT_APP_MODULE}/target/tests/
      - ${IT_APP_MODULE}/target/surefire-reports/
      - ${IT_APP_MODULE}/target/jacoco-${TEST_NAME}-it.exec
    expire_in: 1 day
    reports:
      junit:
        - ${IT_APP_MODULE}/target/surefire-reports/TEST-*.xml
    when: always
  # Selenium rules; the Playwright jobs set their own (see .rules-playwright)
  rules: *rules-selenium

.firefox-testing:
  extends: .browser-testing
  services:
    - name: selenoid/firefox:latest@sha256:3490e022beda383963670c9492d0927705f03f951abfa4f40eb59c9c923d8e5f
      alias: browser
    - name: registry.gitlab.com/aweframework/docker-tools/video-recorder:latest@sha256:6c22e677162e993c4f301c6bcd1e3f5795c5812a3d1efbcfab2c7e92510b483a
      alias: recorder
