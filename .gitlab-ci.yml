    - mysql:8.4.11@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
  parallel:
    matrix:
      - TEST_NAME: [ mysql, mysql-flyway ]

PostgreSQL Tests:
