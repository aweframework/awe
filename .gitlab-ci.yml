##############################
# Pipeline definition
##############################

include:
  # Security Products features
  - template: DAST.gitlab-ci.yml
  - template: Dependency-Scanning.gitlab-ci.yml
  - template: Secret-Detection.gitlab-ci.yml
  - template: Container-Scanning.gitlab-ci.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      auto_cancel:
        on_new_commit: none
    - when: always

default:
  interruptible: true
  timeout: 30m

image: maven:3.9.9-eclipse-temurin-21

variables:
  MAVEN_CLI_OPTS: "-s .m2/settings.xml -Dsettings.security=.m2/settings-security.xml -P!devtools --batch-mode --show-version"
  MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.color=false -Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  MAVEN_REPO_PATH: ".m2/repository"
  SAST_PULL_ANALYZER_IMAGES: "0"
  SAST_RUN_ANALYZER_TIMEOUT: 30m
  SONAR_OPTS: "-Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.organization=$SONAR_ORGANIZATION -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  SKIP_TESTS: "-DskipTests"
  IT_OPTS: "-Dskip.junit=true -Dskip.selenium=false -DgenerateIntegrationReport=true"
  UT_OPTS: "-Dskip.frontend=true -DgenerateUnitReport=true -pl !awe-framework/awe-boot-angular-archetype -pl !awe-framework/awe-boot-react-archetype"
  DEPLOY_OPTS: "-f awe-framework/pom.xml -DskipTests -Darchetype.test.skip=true -Dskip.javadoc=false -Dbuild.environment=production"
  CI_PROJECT_URL_SSH: "origin git@gitlab.com:aweframework/awe.git"
  SPRING_PROFILES_ACTIVE: gitlab-ci
  KUBERNETES_PROJECT_ID: wired-armor-229610
  KUBERNETES_CLUSTER_NAME: awe-boot-cluster
  API_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID"
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the sonar task.
  # Security config
  DAST_WEBSITE: "https://staging.aweframework.com"
  DAST_TARGET_AVAILABILITY_TIMEOUT: 180
  DAST_BROWSER_SCAN: "true"
  DS_EXCLUDED_ANALYZERS: "gemnasium, gemnasium-python"

cache:
  - key: ${CI_COMMIT_REF_SLUG}
    policy: pull
    fallback_keys:
      - develop
    paths:
      - .m2/repository/

stages:
  - build
  - test
  - integration test
  - analysis
  - site
  - package
  - deploy
  - dast
  - release

.git_credentials_template: &git_credentials
  before_script:
    ## Push git credentials
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config --global user.email awe@almis.com
    - git config --global user.name "AWE Robot"
    - git remote set-url $CI_PROJECT_URL_SSH

##############################
# Pipeline rules
##############################

# A pipeline schedule that sets RENOVATE_RUN=true runs only the "Renovate" job. Every other
# job selects itself through the anchors below and excludes that variable here, so the regular
# "Weekly Check" schedule (which does not set it) still runs the full pipeline.
.if-default: &if-default
  if: '$RENOVATE_RUN != "true" && ($CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_REF_NAME == "develop" || $CI_COMMIT_REF_NAME =~ /^support\// || $CI_MERGE_REQUEST_IID)'
.if-master: &if-master
  if: '$RENOVATE_RUN != "true" && $CI_COMMIT_REF_NAME == "master"'
.if-develop: &if-develop
  if: '$RENOVATE_RUN != "true" && $CI_COMMIT_REF_NAME == "develop"'
.if-support: &if-support
  if: '$RENOVATE_RUN != "true" && $CI_COMMIT_REF_NAME =~ /^support\//'
.if-merge-request: &if-merge-request
  if: '$CI_MERGE_REQUEST_IID'
.if-tag: &if-tag
  if: '$CI_COMMIT_TAG'

# Path selection for merge-request pipelines only: rules:changes is only reliable when compared
# against the MR target branch. Branch pipelines (develop/master/support/*) always run the full
# set through .if-branches below, regardless of what changed.
# rules:changes globs are evaluated with Ruby's File.fnmatch (FNM_PATHNAME): "dir/**" matches only
# one path segment below dir, so nested files need "dir/**/*". Keep every directory entry in
# that form, otherwise a change in a nested file selects no job (or breaks the pipeline through
# "needs" on a job that was not selected).
.paths-backend: &paths-backend
  - .gitlab-ci.yml
  - pom.xml
  - .m2/**/*
  - awe-framework/pom.xml
  - awe-framework/awe-dependencies/**/*
  - awe-framework/awe-model/**/*
  - awe-framework/awe-generic-screens/**/*
  - awe-framework/awe-controller/**/*
  - awe-framework/awe-testing/**/*
  - awe-framework/awe-modules/**/*
  - awe-framework/awe-starters/**/*
  - awe-framework/awe-boot-angular-archetype/**/*
  - awe-framework/awe-boot-react-archetype/**/*
  - awe-tests/**/*
  - awe-samples/**/*
.paths-frontend: &paths-frontend
  - .gitlab-ci.yml
  - awe-framework/awe-client-angular/**/*
.paths-website: &paths-website
  - .gitlab-ci.yml
  - website/**/*
  - bin/website-maintenance-docs.sh

.if-mr-backend: &if-mr-backend
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-backend
.if-mr-frontend: &if-mr-frontend
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-frontend
.paths-code: &paths-code             # backend or frontend: the whole Maven reactor
  - .gitlab-ci.yml
  - pom.xml
  - .m2/**/*
  - awe-framework/**/*
  - awe-tests/**/*
  - awe-samples/**/*
.if-mr-code: &if-mr-code
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-code
.if-mr-website: &if-mr-website
  if: '$CI_MERGE_REQUEST_IID'
  changes: *paths-website
.if-branches: &if-branches           # develop, master, support/*: always complete
  if: '$RENOVATE_RUN != "true" && ($CI_COMMIT_REF_NAME == "master" || $CI_COMMIT_REF_NAME == "develop" || $CI_COMMIT_REF_NAME =~ /^support\//)'

##############################
# Build stage
##############################

.build:
  stage: build
  needs: [ ]
  timeout: 20m
  script:
    - mvn $MAVEN_CLI_OPTS install $SKIP_TESTS
    - version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
    - echo "PROJECT_VERSION=$version" >> build.env
  rules:
    - <<: *if-mr-code
    - <<: *if-branches

# docker-tools images are pinned as tag@digest: the registry only publishes a
# "latest" tag (no immutable version tags), so the digest is what actually
# freezes the image; the "latest" part is kept only so the reference stays
# human-readable. Renovate (#761) tracks and updates these digests.
.build-website:
  image: registry.gitlab.com/aweframework/docker-tools/website-build:latest@sha256:1bf9d446f348326e4997d62d3890625e3d9b6993b3ab682600b67ac1f2e882d9
  stage: build
  needs: [ ]
  timeout: 20m
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/website/.npm"
  script:
    - npm --prefix website ci
  cache:
    key: website-npm-${CI_COMMIT_REF_SLUG}
    fallback_keys:
      - website-npm-develop
    paths:
      - website/.npm
  artifacts:
    paths:
      - website/build
    expire_in: 1 day

.renovate-image:
  image:
    name: ghcr.io/renovatebot/renovate:44@sha256:5e9ea3e65b3e8e7c0caf813214ed0705827433b7ea19e65f697083cca3a9c0e7   # major pin + digest; Renovate updates its own pin
    entrypoint: [""]

# Runs from the "Renovate" pipeline schedule only (variable RENOVATE_RUN=true); configuration lives
# in renovate.json. See "Dependency updates" in website/docs/guides/release-lines-and-support.md.
Renovate:
  extends: .renovate-image
  stage: build
  interruptible: false
  timeout: 1h
  needs: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: $CI_API_V4_URL
    RENOVATE_REPOSITORIES: $CI_PROJECT_PATH
    RENOVATE_ONBOARDING: "false"
    RENOVATE_REQUIRE_CONFIG: required
    RENOVATE_BASE_DIR: $CI_PROJECT_DIR/renovate
    RENOVATE_REPOSITORY_CACHE: enabled
    LOG_LEVEL: info
    FORCE_COLOR: "3"
  # RENOVATE_TOKEN (masked, protected project access token) and the optional
  # RENOVATE_GITHUB_COM_TOKEN come from CI variables. Set RENOVATE_DRY_RUN=full on the
  # schedule to rehearse a run without opening merge requests.
  script:
    - renovate
  # The RENOVATE_TOKEN variable is scoped to this environment so that no other job on a
  # protected ref receives it (build jobs execute dependency code).
  environment:
    name: renovate
    action: prepare
  cache:
    key: renovate
    paths:
      - renovate/cache/renovate/repository/
    when: always
  resource_group: renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_RUN == "true"'

# Validates renovate.json (repository config, strict) on merge requests that change it.
Validate renovate config:
  extends: .renovate-image
  stage: build
  needs: []
  timeout: 10m
  script:
    - renovate-config-validator --strict
  rules:
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - renovate.json

Build project:
  extends: .build
  script:
    - mvn $MAVEN_CLI_OPTS install $SKIP_TESTS
    # Aggregate CycloneDX SBOM for the whole reactor (only this job publishes it; the jdk 21
    # variant builds the same reactor and would only duplicate the report).
    - mvn $MAVEN_CLI_OPTS -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DoutputName=awe-sbom
    - version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
    - echo "PROJECT_VERSION=$version" >> build.env
  # Keep the cache small: drop the awe-boot fat jar (~250MB per version) and stale AWE snapshots
  # before the cache is archived. Otherwise it grows on every release until the runner runs out of disk.
  after_script:
    - version=$(sed -n 's/^PROJECT_VERSION=//p' build.env 2>/dev/null)
    - rm -rf .m2/repository/com/almis/awe/awe-boot
    - >-
      if [ -n "$version" ]; then
      find .m2/repository/com/almis/awe -mindepth 2 -maxdepth 2 -type d -name '*-SNAPSHOT' ! -name "$version"
      -exec rm -rf {} +; fi
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - awe-tests/awe-boot/target/awe-boot.jar
      # AWE modules installed by this build, consumed by the browser testing jobs
      - .m2/repository/com/almis/awe/
      # Aggregate SBOM: kept as a plain artifact and attached to the image by "Build package".
      # It is deliberately NOT declared as a "reports: cyclonedx" artifact: GitLab's dependency
      # list requires its own CycloneDX properties (gitlab:meta:schema_version, input_file:path)
      # and flags "Error parsing SBOM reports" otherwise; the gemnasium job already feeds the
      # dependency list with a GitLab-formatted SBOM of the same Maven reactor.
      - target/awe-sbom.json
    expire_in: 1 day
  cache:
    - key: ${CI_COMMIT_REF_SLUG}
      policy: pull-push
      fallback_keys:
        - develop
      paths:
        - .m2/repository/

Build project:jdk 21:
  extends: .build
  image: maven:3.9.9-eclipse-temurin-21
  variables:
    SKIP_TESTS: "-DskipTests -Dskip.delombok=true"

Build website:
  extends: .build-website
  script:
    - npm --prefix website ci
    # Inject the live 4.x maintenance-line docs (support/4.x) as a versioned snapshot
    # before building, so the MR pipeline validates the same injection used in production.
    - chmod +x ./bin/website-maintenance-docs.sh
    - ./bin/website-maintenance-docs.sh
    - npm --prefix website run build
  rules:
    - <<: *if-mr-website

Build website with i18n:
  extends: .build-website
  interruptible: false
  script:
    - npm --prefix website ci
    # Inject the live 4.x maintenance-line docs (support/4.x) as a versioned snapshot before
    # building, so Crowdin syncs its sources too and the published site tracks support/4.x.
    - chmod +x ./bin/website-maintenance-docs.sh
    - ./bin/website-maintenance-docs.sh
    # Do translations
    - npm --prefix website run crowdin:sync
    - npm --prefix website run build
  resource_group: crowdin
  # Support branches are intentionally excluded: no Crowdin sync for maintenance lines.
  rules:
    - <<: *if-develop
    - <<: *if-master

##############################
# testing stage
##############################

# Unit testing extension
.unit-testing:
  stage: test
  allow_failure: false
  timeout: 20m
  needs:
    - job: Build project
      artifacts: false
  variables:
    TZ: Europe/Madrid
  script:
    - mvn $MAVEN_CLI_OPTS verify $UT_OPTS -P$TEST_NAME -Djacoco.file.name=jacoco-${TEST_NAME}-ut.exec -Doracle.jdbc.J2EE13Compliant=true -Doracle.jdbc.timezoneAsRegion=false
  rules:
    - <<: *if-mr-backend
    - <<: *if-branches
  artifacts:
    paths:
      - "**/target/*.exec"
      - "**/target/surefire-reports"
      - "**/target/zerocode*.csv"
    when: always
    expire_in: 1 day
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"

All UT:
  extends: .unit-testing
  script:
    - mvn $MAVEN_CLI_OPTS verify $UT_OPTS -Djacoco.file.name=jacoco-all-ut.exec

Embedded DB Tests:
  extends: .unit-testing
  parallel:
    matrix:
      - TEST_NAME: [ h2, h2-flyway, hsql-flyway ]

MySQL Tests:
  extends: .unit-testing
  variables:
    MYSQL_DATABASE: "awetestdb"
    MYSQL_ROOT_PASSWORD: "$DATABASE_PASSWORD"
  services:
    - mysql:8.4.9
  parallel:
    matrix:
      - TEST_NAME: [ mysql, mysql-flyway ]

PostgreSQL Tests:
  extends: .unit-testing
  variables:
    POSTGRES_DB: "awetestdb"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "$DATABASE_PASSWORD"
  services:
    - name: postgres:17.9
      alias: postgres
  parallel:
    matrix:
      - TEST_NAME: [ postgresql, postgresql-flyway ]

Oracle Tests:
  extends: .unit-testing
  variables:
    ORACLE_ALLOW_REMOTE: "true"
    ORACLE_PASSWORD: "$DATABASE_PASSWORD"
    RELAX_SECURITY: "1"
  services:
    - name: epiclabs/docker-oracle-xe-11g:latest@sha256:404173b90d09d0619c854dd469c76c3e7256c88a7aac5d47e05f934ec7afae06
      alias: oracle
  parallel:
    matrix:
      - TEST_NAME: [ oracle, oracle-flyway ]

SQL Server Tests:
  extends: .unit-testing
  image: registry.gitlab.com/aweframework/docker-tools/sqlserver-testing:latest@sha256:9f3ce1ccebdc1374f382670a47aeef0f4ec056eb959c660bd67ca48cfdc24517
  variables:
    ACCEPT_EULA: Y
    SA_PASSWORD: "$DATABASE_PASSWORD"
  before_script:
    - /opt/mssql-tools18/bin/sqlcmd -No -S mssqlserver -U SA -P "$DATABASE_PASSWORD" -Q 'CREATE DATABASE awetestdb'
  services:
    - name: mcr.microsoft.com/mssql/server:2019-CU32-ubuntu-20.04
      alias: mssqlserver
  parallel:
    matrix:
      - TEST_NAME: [ sqlserver, sqlserver-flyway ]

Frontend UT:
  stage: test
  image: registry.gitlab.com/aweframework/docker-tools/browsers-jdk21-node-maven:latest@sha256:611a6928ed5696bccb29fd3ce0b0a6fe0818d26a59119f9b04056dd61c2fa33d
  needs: [ ]
  cache: { }
  timeout: 15m
  variables:
    BABEL_ENV: test
    NODE_ENV: test
  script:
    - mvn -f awe-framework/awe-client-angular/pom.xml $MAVEN_CLI_OPTS test
  artifacts:
    paths:
      - awe-framework/awe-client-angular/target/reports/jest/
    expire_in: 1 day
    reports:
      junit:
        - awe-framework/awe-client-angular/target/reports/jest/junit/*.xml
  rules:
    - <<: *if-mr-frontend
    - <<: *if-branches

Javadoc test:
  stage: test
  timeout: 20m
  needs:
    - job: Build project
      artifacts: false
  script:
    - mvn -f awe-framework/pom.xml $MAVEN_CLI_OPTS javadoc:aggregate-no-fork -Dskip.javadoc=false -Ptest-javadoc
  artifacts:
    paths:
      - awe-framework/target/site/apidocs
    expire_in: 1 day
  rules:
    - <<: *if-mr-backend

##############################
# Integration testing stage
##############################

# Browser testing extension
.browser-testing:
  image: maven:3.9.9-eclipse-temurin-21
  stage: integration test
  # Selenium suites block the pipeline (and therefore Renovate's automerge and the release jobs
  # that need Sonar). One automatic job retry absorbs an occasional flaky run until per-test
  # retry and a quarantine exist (#766); a real regression fails twice and still blocks.
  # Timeouts are not retried: a hung browser session should fail within one timeout window.
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
  timeout: 30m
  variables:
    SCREEN_WIDTH: 1440
    SCREEN_HEIGHT: 1080
    FF_NETWORK_PER_BUILD: "true"
  # Artifacts provide the AWE snapshot modules built in this pipeline, independently of the cache state
  needs:
    - job: Build project
      artifacts: true
  # Important! Print/PDF IT tests render server-side and need system fonts.
  # eclipse-temurin is a minimal image, so install fontconfig + fonts here.
  before_script:
    - apt-get update -qq && apt-get install -y -qq fontconfig fonts-dejavu >/dev/null
  script:
    - mvn -f awe-tests/awe-boot/pom.xml $MAVEN_CLI_OPTS verify $IT_OPTS -Dawe.test.browser=${BROWSER} -Dawe.test.screenshot-path=${CI_PROJECT_DIR}/selenium-evidence/ -Dgroups="${TEST_TAGS}" -Djacoco.file.name=jacoco-${TEST_NAME}-it.exec -Djacoco.port=$TEST_PORT
    - echo "I am going to wait for 10 seconds only to ensure .exec file generation"
    - sleep 10
  after_script:
    - |
      if [ -d selenium-evidence ] && [ -n "$(find selenium-evidence -type f 2>/dev/null | head -n 1)" ]; then
        echo "Selenium evidence (screenshots and videos): ${CI_JOB_URL}/artifacts/browse/selenium-evidence/"
        echo "Files in selenium-evidence/: $(find selenium-evidence -type f | wc -l)"
      fi
  # Failure evidence (screenshots and videos) is written under selenium-evidence/, at the artifact root.
  # It has no expose_as: GitLab does not display it when a path uses a CI variable, and the per-job
  # jacoco file name (needed by Launch Sonar) requires one.
  artifacts:
    paths:
      - selenium-evidence/
      - awe-tests/awe-boot/target/tests/
      - awe-tests/awe-boot/target/surefire-reports/
      - awe-tests/awe-boot/target/jacoco-${TEST_NAME}-it.exec
    expire_in: 1 day
    reports:
      junit:
        - awe-tests/awe-boot/target/surefire-reports/TEST-*.xml
    when: always
  rules:
    - <<: *if-mr-code
    - <<: *if-branches

.firefox-testing:
  extends: .browser-testing
  services:
    - name: selenoid/firefox:latest@sha256:3490e022beda383963670c9492d0927705f03f951abfa4f40eb59c9c923d8e5f
      alias: browser
    - name: registry.gitlab.com/aweframework/docker-tools/video-recorder:latest@sha256:6c22e677162e993c4f301c6bcd1e3f5795c5812a3d1efbcfab2c7e92510b483a
      alias: recorder
  variables:
    BROWSER: service-firefox

.chrome-testing:
  extends: .browser-testing
  services:
    - name: selenoid/chrome:latest@sha256:0a3626278323dc19584598fcc9d4209a4c1dc5ef2065b29812f1dc277d6e0640
      alias: browser
    - name: registry.gitlab.com/aweframework/docker-tools/video-recorder:latest@sha256:6c22e677162e993c4f301c6bcd1e3f5795c5812a3d1efbcfab2c7e92510b483a
      alias: recorder
  variables:
    BROWSER: service-chrome

Firefox IT:
  extends: .firefox-testing
  parallel:
    matrix:
      - TEST_TAGS: ApplicationIntegrationIT
        TEST_PORT: "6301"
        TEST_NAME: firefox-application-integration
      - TEST_TAGS: CRUDCriteriaMatrixIT
        TEST_PORT: "6302"
        TEST_NAME: firefox-crud-criteria-matrix
      - TEST_TAGS: RegressionWebsocketPrintIT
        TEST_PORT: "6303"
        TEST_NAME: firefox-regression-websocket-print
      - TEST_TAGS: SchedulerIT
        TEST_PORT: "6304"
        TEST_NAME: firefox-scheduler

Chrome IT:
  extends: .chrome-testing
  parallel:
    matrix:
      - TEST_TAGS: ApplicationIntegrationIT
        TEST_PORT: "6305"
        TEST_NAME: chrome-application-integration
      - TEST_TAGS: CRUDCriteriaMatrixIT
        TEST_PORT: "6306"
        TEST_NAME: chrome-crud-criteria-matrix
      - TEST_TAGS: RegressionWebsocketPrintIT
        TEST_PORT: "6307"
        TEST_NAME: chrome-regression-websocket-print
      - TEST_TAGS: SchedulerIT
        TEST_PORT: "6308"
        TEST_NAME: chrome-scheduler

gemnasium-maven-dependency_scanning:
  stage: test
  timeout: 15m
  rules:
    - <<: *if-mr-code
    - <<: *if-branches
  dependencies: ["Build project"]
  needs:
    - job: Build project
  variables:
    MAVEN_CLI_OPTS: "-DskipTests --batch-mode"

# Runs on every merge request that touches code or the website, and on every branch pipeline.
secret_detection:
  needs: [ ]
  timeout: 15m
  rules:
    - <<: *if-mr-code
    - <<: *if-mr-website
    - <<: *if-branches

##############################
# Analysis stage
##############################

Launch Sonar:
  image: registry.gitlab.com/aweframework/docker-tools/sonar:latest@sha256:8fb0e07eaf7c9f935c461599bcde7ac7714ac8a9cc3def02ee97195094316c0c
  stage: analysis
  timeout: 20m
  # Some needs are optional: a merge-request pipeline may run Sonar (backend or frontend changed)
  # without running the narrower backend-only or frontend-only job groups.
  needs:
    - job: All UT
      optional: true
    - job: Embedded DB Tests
      optional: true
    - job: MySQL Tests
      optional: true
    - job: PostgreSQL Tests
      optional: true
    - job: Oracle Tests
      optional: true
    - job: SQL Server Tests
      optional: true
    - job: Frontend UT
      optional: true
    - job: Firefox IT
    - job: Chrome IT
  cache:
    - key: ${CI_COMMIT_REF_SLUG}
      policy: pull
      paths:
        - .m2/repository/
    - key: ${CI_JOB_NAME}
      paths:
        - .sonar/cache
  script:
    # A merge-request pipeline that did not run "Frontend UT" (backend-only change) has no Jest
    # report directory at all, and the Sonar scanner fails on a missing generic test execution
    # report (sonar.testExecutionReportPaths in the root pom). Only in that case provide an empty
    # but valid report so the Java analysis still runs. If the directory exists (Frontend UT ran)
    # but the report is missing, fail loudly instead of hiding a broken artifact.
    - JEST_REPORTS_DIR=awe-framework/awe-client-angular/target/reports/jest
    - |
      if [ ! -d "$JEST_REPORTS_DIR" ]; then
        mkdir -p "$JEST_REPORTS_DIR/sonar"
        echo '<testExecutions version="1"></testExecutions>' > "$JEST_REPORTS_DIR/sonar/javascriptUnitTests.xml"
        echo "Frontend UT was not part of this pipeline: Sonar runs with an empty Jest report"
      elif [ ! -f "$JEST_REPORTS_DIR/sonar/javascriptUnitTests.xml" ]; then
        echo "Frontend UT ran but its Sonar report is missing under $JEST_REPORTS_DIR" >&2
        exit 1
      fi
    # SonarCloud rejects branch parameters on merge request analyses, so only set sonar.branch.name outside MRs.
    - SONAR_BRANCH_OPTS=""
    - if [ -z "$CI_MERGE_REQUEST_IID" ]; then SONAR_BRANCH_OPTS="-Dsonar.branch.name=$CI_COMMIT_REF_NAME"; fi
    # Dependency scanning is done by GitLab's gemnasium job and the CycloneDX SBOM, not by the
    # (unused) OWASP dependency-check Maven plugin, so its flag is not passed here.
    - mvn $MAVEN_CLI_OPTS verify -Dskip.frontend=true -DgenerateCoverageReport=true sonar:sonar $SKIP_TESTS -Darchetype.test.skip=true $SONAR_OPTS $SONAR_BRANCH_OPTS
    - cat awe-tests/awe-boot/target/coverage-reports/index.html | grep -o 'Total[^%]*%' | sed -e 's/Total/Jacoco-Test-Coverage:/g'
  artifacts:
    paths:
      - awe-tests/awe-boot/target/coverage-reports/
    expire_in: 1 week
  rules:
    - <<: *if-mr-code
    - <<: *if-branches

##############################
# Site stage
##############################

Generate javadoc & schemas:
  stage: site
  needs: [ ]
  timeout: 20m
  script:
    - mvn $MAVEN_CLI_OPTS install site javadoc:aggregate $SKIP_TESTS -Darchetype.test.skip=true -Dskip.javadoc=false -Dskip.main=true -Dskip.frontend=true -Dbuild.environment=production -f awe-framework/pom.xml
  artifacts:
    paths:
      - awe-framework/target/site/apidocs
      - awe-framework/awe-generic-screens/src/main/resources/schemas/
    expire_in: 1 day
  rules:
    - <<: *if-master
    - <<: *if-develop
    - <<: *if-support

##############################
# Package stage
##############################

Build package:
  image: docker:28.5.2-cli
  stage: package
  cache: { }
  interruptible: false
  timeout: 15m
  # Keyless cosign signing: GitLab issues an OIDC token scoped to the "sigstore" audience,
  # cosign uses it to sign/attest against public Sigstore infrastructure with no stored key.
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
  needs:
    - job: Build project
      artifacts: true
    - job: Launch Sonar
      artifacts: false
  services:
    - docker:28.5.2-dind
  before_script:
    - apk add --no-cache cosign
  script:
    # Gitlab container
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com
    - docker build -t registry.gitlab.com/aweframework/awe/awe-boot:$PROJECT_VERSION ./awe-tests/awe-boot
    - docker push registry.gitlab.com/aweframework/awe/awe-boot:$PROJECT_VERSION
    - digest=$(docker images registry.gitlab.com/aweframework/awe/awe-boot --format="{{.Digest}}" --digests)
    - echo "PACKAGE_DIGEST=$digest" >> build.env
    # Sign the image once by digest (every floating tag pushed below shares it) and attest the
    # SBOM built by "Build project" against the same digest.
    - GITLAB_IMAGE_DIGEST_REF="registry.gitlab.com/aweframework/awe/awe-boot@${digest}"
    - cosign sign "$GITLAB_IMAGE_DIGEST_REF"
    - cosign attest --type cyclonedx --predicate target/awe-sbom.json "$GITLAB_IMAGE_DIGEST_REF"
    # Docker Hub container
    - docker login -u $DOCKER_HUB_USER -p $DOCKER_HUB_TOKEN
    - docker build -t aweframework/awe-boot:$PROJECT_VERSION ./awe-tests/awe-boot
    - docker push aweframework/awe-boot:$PROJECT_VERSION
    # RepoDigests lists one entry per registry the image was pushed to; pick the Docker Hub one explicitly.
    - DOCKERHUB_IMAGE_DIGEST_REF=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' aweframework/awe-boot:$PROJECT_VERSION | grep '^aweframework/awe-boot@' | head -n1)
    - test -n "$DOCKERHUB_IMAGE_DIGEST_REF" || { echo "Docker Hub digest not found for aweframework/awe-boot:$PROJECT_VERSION"; exit 1; }
    - cosign sign "$DOCKERHUB_IMAGE_DIGEST_REF"
    # Support branches (maintenance lines) also get floating major and major.minor tags, never "latest".
    - |
      if [[ "$CI_COMMIT_REF_NAME" == support/* ]]; then
        CLEAN_VERSION="${PROJECT_VERSION%-SNAPSHOT}"
        MAJOR_VERSION="${CLEAN_VERSION%%.*}"
        MAJOR_MINOR_VERSION="${CLEAN_VERSION%.*}"
        for TAG in "$MAJOR_VERSION" "$MAJOR_MINOR_VERSION"; do
          docker tag registry.gitlab.com/aweframework/awe/awe-boot:$PROJECT_VERSION registry.gitlab.com/aweframework/awe/awe-boot:$TAG
          docker push registry.gitlab.com/aweframework/awe/awe-boot:$TAG
          docker tag aweframework/awe-boot:$PROJECT_VERSION aweframework/awe-boot:$TAG
          docker push aweframework/awe-boot:$TAG
        done
      fi
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 week
  rules:
    - <<: *if-develop
    - <<: *if-master
    - <<: *if-support

# Scans the image just pushed by "Build package". allow_failure is true for the first weeks
# after adoption, so findings are visible without blocking releases; tighten once triaged.
container_scanning:
  stage: deploy
  timeout: 15m
  allow_failure: true
  needs:
    - job: Build package
  # The template sets "dependencies: []", which disables artifact download and therefore the
  # build.env dotenv from "Build package"; re-enable it so PACKAGE_DIGEST is available.
  dependencies:
    - Build package
  variables:
    # Scan exactly the image that was pushed and signed: by digest, taken from the build.env
    # dotenv that "Build package" exports (PACKAGE_DIGEST), never by a floating tag.
    CS_IMAGE: "$CI_REGISTRY_IMAGE/awe-boot@$PACKAGE_DIGEST"
  before_script:
    - |
      if [ -z "$PACKAGE_DIGEST" ]; then
        echo "PACKAGE_DIGEST is empty: the build.env dotenv from Build package was not received"
        exit 1
      fi
      export CS_IMAGE="$CI_REGISTRY_IMAGE/awe-boot@$PACKAGE_DIGEST"
      echo "Scanning $CS_IMAGE"
  rules:
    - <<: *if-develop
    - <<: *if-master
    - <<: *if-support

##############################
# Deploy stage
##############################

Deploy snapshot:
  stage: deploy
  interruptible: false
  timeout: 20m
  needs:
    - job: Launch Sonar
  script:
    - mvn $MAVEN_CLI_OPTS deploy $DEPLOY_OPTS
  rules:
    - <<: *if-develop
    - <<: *if-support

Deploy Maven Central:
  stage: deploy
  image: registry.gitlab.com/aweframework/docker-tools/ci-release:latest@sha256:3a9587bd84e1ca6ed0550701b3e7ee4b35f4c2c8b580d2aa286a48dd36911682
  interruptible: false
  timeout: 1h
  needs: [ ]
  before_script:
    ## Add gpg key to sign
    - gpg --batch --import <(echo "$GPG_PRIVATE_KEY")
  script:
    - mvn $MAVEN_CLI_OPTS deploy $DEPLOY_OPTS -DperformRelease=true
  rules:
    - <<: *if-tag

# Kubernetes deployment
.k8s_deploy:
  image: registry.gitlab.com/aweframework/docker-tools/ci-utilities:latest@sha256:823e0e37eaebd96a136475f4a626fd851f36a313175e06afd252c01567ed5ea7
  cache: { }
  interruptible: false
  timeout: 15m
  variables:
    GIT_STRATEGY: none
  needs:
    - job: Build project
    - job: Launch Sonar
      artifacts: false
    - job: Build package
  stage: deploy
  script:
    - git clone ${GIT_REPO_AWE_CONFIG}
    - git config --global user.email ${GIT_REPO_CI_USER_EMAIL}
    - git config --global user.name "${GIT_REPO_CI_USER_NAME}"
    - cd awe-gke-config/manifests/${CI_ENVIRONMENT_SLUG}/awe-boot/kustomize
    - kustomize edit set image registry.gitlab.com/aweframework/awe/awe-boot@${PACKAGE_DIGEST}
    - kustomize edit set annotation version:${PROJECT_VERSION}
    - kustomize build -o awe-boot-deployment.yaml
    - git commit . -m "Updated awe-boot kubernetes deployment ${CI_ENVIRONMENT_SLUG}"
    - git push origin master

Deploy staging:
  extends: .k8s_deploy
  environment:
    name: staging
    url: https://staging.aweframework.com
    kubernetes:
      namespace: staging
  # Support branches are intentionally excluded: no k8s staging deployment for maintenance lines.
  rules:
    - <<: *if-develop

Deploy production:
  extends: .k8s_deploy
  environment:
    name: production
    url: https://demo.aweframework.com
    kubernetes:
      namespace: production
  # Support branches are intentionally excluded: no k8s production deployment for maintenance lines.
  rules:
    - <<: *if-master

dast:
  interruptible: false
  timeout: 15m
  script:
    - export DAST_WEBSITE=${DAST_WEBSITE:-$(cat environment_url.txt)}
    - if [ -z "$DAST_WEBSITE$DAST_API_SPECIFICATION" ]; then echo "Either DAST_WEBSITE or DAST_API_SPECIFICATION must be set. See https://docs.gitlab.com/ee/user/application_security/dast/#configuration for more details." && exit 1; fi
    - /analyze
  needs:
    - job: Deploy staging
  # Support branches are intentionally excluded: DAST only runs against the staging deployment.
  rules:
    - <<: *if-develop

pages:
  image: docker:28.5.2-cli
  stage: deploy
  cache: { }
  interruptible: false
  timeout: 15m
  needs:
    - job: Generate javadoc & schemas
    - job: Build website with i18n
  script:
    - mkdir -p .public/docs/schemas
    - cp -r awe-framework/target/site/apidocs .public/javadoc-api/
    - cp -r awe-framework/awe-generic-screens/src/main/resources/schemas/awe/*.xsd .public/docs/schemas/
    - cp -a website/build/. .public/
    - mv .public public
  artifacts:
    paths:
      - public
    expire_in: 1 day
  # Support branches are intentionally excluded: Pages has a single site root, no per-branch publishing.
  rules:
    - <<: *if-master
    - <<: *if-develop

Generate release notes:
  image: registry.gitlab.com/aweframework/docker-tools/ci-release:latest@sha256:3a9587bd84e1ca6ed0550701b3e7ee4b35f4c2c8b580d2aa286a48dd36911682
  cache: { }
  interruptible: false
  dependencies: [ ]
  needs: [ ]
  stage: deploy
  script:
    - ./bin/release_notes.sh $API_URL $API_TOKEN "$CI_PROJECT_TITLE"
  artifacts:
    paths:
      - release_notes.md
    expire_in: 1 week
  rules:
    - <<: *if-tag

##############################
# Release stage
##############################

Generate a new milestone:
  image: registry.gitlab.com/aweframework/docker-tools/ci-utilities:latest@sha256:823e0e37eaebd96a136475f4a626fd851f36a313175e06afd252c01567ed5ea7
  stage: release
  interruptible: false
  needs: [ ]
  script:
    ## Generate milestones from the version being tagged, without checking out develop
    ## (a develop checkout would read the wrong version once develop moves to 5.0.0-SNAPSHOT).
    ## milestone.sh receives the released version and creates the next bugfix, minor and major milestones.
    - VERSION="${CI_COMMIT_TAG#v}"
    - chmod +x ./bin/milestone.sh
    - ./bin/milestone.sh $API_URL $API_TOKEN "$VERSION"
  rules:
    - <<: *if-tag

Start a new release:
  image: registry.gitlab.com/aweframework/docker-tools/ci-release:latest@sha256:3a9587bd84e1ca6ed0550701b3e7ee4b35f4c2c8b580d2aa286a48dd36911682
  cache: { }
  interruptible: false
  timeout: 1h
  dependencies: [ ]
  # Release gate: the manual job only becomes available once analysis, packaging and the
  # snapshot deploy of this commit have succeeded (what the stage order guaranteed before).
  needs:
    - job: Launch Sonar
      artifacts: false
    - job: Build package
      artifacts: false
    - job: Deploy snapshot
  stage: release
  <<: *git_credentials
  script:
    ## Generate release
    - git checkout $CI_COMMIT_REF_NAME
    - chmod +x ./bin/release.sh
    - ./bin/release.sh $API_URL $API_TOKEN "$CI_PROJECT_TITLE"
    - git checkout ./bin/release.sh
    - git add ./CHANGELOG.md
    - git commit -m "Generated CHANGELOG"
    ## Generate new version of documentation if major or minor
    - chmod +x ./bin/docusaurus.sh
    - ./bin/docusaurus.sh
    ## Generate release: develop releases through gitflow:release (develop -> master),
    ## support branches release through the hotfix-based support-release.sh script.
    - |
      case "$CI_COMMIT_REF_NAME" in
        support/*)
          chmod +x ./bin/support-release.sh
          ./bin/support-release.sh
          ;;
        *)
          mvn -B gitflow:release -DskipTestProject=true -DpushRemote=true -DversionProperty=revision
          ;;
      esac
  variables:
    GIT_STRATEGY: clone
  rules:
    - <<: *if-develop
      when: manual
      allow_failure: true
    - <<: *if-support
      when: manual
      allow_failure: true

Notify new release:
  image: registry.gitlab.com/aweframework/docker-tools/ci-utilities:latest@sha256:823e0e37eaebd96a136475f4a626fd851f36a313175e06afd252c01567ed5ea7
  stage: release
  interruptible: false
  # Only announce a release whose artifacts and GitLab release actually exist.
  needs:
    - job: Deploy Maven Central
    - job: Generate gitlab release
  script:
    ## Generate milestone
    - chmod +x ./bin/sendmail.sh
    - ./bin/sendmail.sh $RELEASE_MAIL_TOKEN $RELEASE_MAIL_FROM $RELEASE_MAIL_TO $RELEASE_MAIL_TEMPLATE_ID
  rules:
    - <<: *if-tag
      when: delayed
      start_in: 20 minutes

Generate gitlab release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  interruptible: false
  needs:
    - job: Generate release notes
      artifacts: true
  rules:
    - <<: *if-tag
  script:
    - echo "Creating release"
  release:
    name: 'Release $CI_COMMIT_TAG'
    description: release_notes.md
    tag_name: '$CI_COMMIT_TAG'
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: 'Container Image $CI_COMMIT_TAG'
          url: "https://$CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG:$CI_COMMIT_SHA"
